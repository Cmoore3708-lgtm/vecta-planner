name: Apply V330 Fleet column correction
on:
  push:
    paths:
      - '.github/workflows/apply-v330.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply correction
        run: |
          git apply --check .vecta/v330.patch
          git apply .vecta/v330.patch
          rm .vecta/v330.patch .github/workflows/apply-v330.yml
      - name: Verify correction
        run: |
          npm ci
          npm test
          node --test tests/finance-integrity.mjs
          npm run build
          git restore --worktree dist
          git clean -fd -- dist
      - name: Commit correction
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore due work beside email checkbox"
          git push
