name: Disable Fleet-open MOT polling

on:
  push:
    paths:
      - '.github/workflows/disable-fleet-open-mot-polling.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable redundant browser MOT checks
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old_v207="  function onFleetOpen(){\n    var changed=repairCompletedHistory();\n    refreshDueMots().then(function(n){if(n&&typeof render==='function'&&view==='fleet')render();});\n    return changed;\n  }"
          new_v207="  function onFleetOpen(){\n    /* MOT data is refreshed by the nightly server job or the explicit manual check. */\n    return repairCompletedHistory();\n  }"
          if text.count(old_v207)!=1: raise SystemExit(f'Expected one v207 Fleet-open MOT hook, found {text.count(old_v207)}')
          text=text.replace(old_v207,new_v207,1)
          old_v234="  function runWhenFleetOpens(){\n    reconcile(false).then(function(r){\n      if((r.changed||0)>0 && typeof render==='function' && typeof view!=='undefined' && view==='fleet')render();\n    });\n  }"
          new_v234="  function runWhenFleetOpens(){\n    /* No automatic MOT network scan on Fleet renders. */\n    return;\n  }"
          if text.count(old_v234)!=1: raise SystemExit(f'Expected one v234 Fleet-open reconcile hook, found {text.count(old_v234)}')
          text=text.replace(old_v234,new_v234,1)
          old_v254="function v254RunOnFleetOpen(){\n  if(Date.now()-v254LastOpenRun<30000)return;\n  v254LastOpenRun=Date.now();\n  v254Reconcile({manual:false}).then(function(r){\n    if(r.changed&&typeof render==='function'&&typeof view!=='undefined'&&view==='fleet')render();\n  });\n}"
          new_v254="function v254RunOnFleetOpen(){\n  /* Nightly refresh and the explicit manual check are authoritative. */\n  return;\n}"
          if text.count(old_v254)!=1: raise SystemExit(f'Expected one v254 Fleet-open reconcile hook, found {text.count(old_v254)}')
          text=text.replace(old_v254,new_v254,1)
          path.write_text(text,encoding='utf-8')

      - name: Verify safety invariants
        shell: python
        run: |
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert "refreshDueMots().then(function(n){if(n&&typeof render==='function'&&view==='fleet')render();});" not in text
          assert "reconcile(false).then(function(r)" not in text
          assert "v254Reconcile({manual:false}).then(function(r)" not in text
          assert "try{fleetRunManualMotCheck=v255Manual;}" in text
          print('Automatic browser MOT scans removed; manual control preserved')

      - name: Commit fix
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Stop Fleet Manager automatic MOT scan loop"
          git push
