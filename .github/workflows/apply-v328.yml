name: Apply V328 byte-safe cross-device repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v328.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and verify repair
        run: |
          git apply --check .vecta/v328.patch
          git apply .vecta/v328.patch
          rm .vecta/v328.patch
          rm .github/workflows/apply-v328.yml
          npm ci
          node tests/phone-sync-integrity.mjs
          node tests/finance-integrity.mjs
          npm run build
          git restore --worktree dist
          git clean -fd -- dist
      - name: Publish verified repair
        run: |
          git config user.name "VECTA Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix cross-device mechanic updates"
          git push origin HEAD:main
