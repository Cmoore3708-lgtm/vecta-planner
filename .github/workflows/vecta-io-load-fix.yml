name: VECTA IO load fix

on:
  push:
    paths:
      - '.github/workflows/vecta-io-load-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated IO patch
        run: python .github/scripts/vecta_io_patch.py
      - name: Commit fix
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Fix Supabase IO feedback loops and legacy sync storm"
          git push
