name: VECTA protected maintenance

on:
  push:
    branches:
      - safety/regression-foundation
    paths:
      - '.github/scripts/safety_simplify_duplicates.mjs'
      - '.github/workflows/safety-maintenance.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded simplification
        run: node .github/scripts/safety_simplify_duplicates.mjs index.html
      - name: Run regression checks
        run: npm test
      - name: Verify production build
        run: npm run build -- --outDir /tmp/vecta-protected-build
      - name: Confirm only the intended file changed
        run: test "$(git diff --name-only)" = "index.html"
      - name: Save tested simplification
        run: |
          git config user.name "VECTA protected maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Safely remove overridden duplicate rules"
          git push
