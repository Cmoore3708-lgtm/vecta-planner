name: Fix workshop settings feedback loop

on:
  push:
    paths:
      - '.github/workflows/fix-workshop-settings-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch redundant settings writes and realtime feedback
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          realtime = "    .on('postgres_changes',{event:'*',schema:'public',table:'workshop_settings'},scheduleCloudRefresh)\n"
          if text.count(realtime) != 1:
              raise SystemExit(f'Expected exactly one workshop_settings realtime subscription, found {text.count(realtime)}')
          text = text.replace(realtime, '', 1)

          old_mot = "async function persistFleetMotAuthority(){if(!remoteClient)return false;try{var stamp=new Date().toISOString(),res=await remoteClient.from('workshop_settings').upsert({id:FLEET_MOT_AUTHORITY_CLOUD_ID,value:{version:260,records:fleetMotAuthority||{},updated_at:stamp},updated_at:stamp},{onConflict:'id'});if(res.error)throw res.error;return true}catch(e){console.warn('MOT authority cloud save failed',e);return false}}"
          new_mot = "var fleetMotAuthorityLastPersisted=null;\nasync function persistFleetMotAuthority(){if(!remoteClient)return false;try{var payload=JSON.stringify(fleetMotAuthority||{});if(payload===fleetMotAuthorityLastPersisted)return true;var stamp=new Date().toISOString(),res=await remoteClient.from('workshop_settings').upsert({id:FLEET_MOT_AUTHORITY_CLOUD_ID,value:{version:260,records:fleetMotAuthority||{},updated_at:stamp},updated_at:stamp},{onConflict:'id'});if(res.error)throw res.error;fleetMotAuthorityLastPersisted=payload;return true}catch(e){console.warn('MOT authority cloud save failed',e);return false}}"
          if text.count(old_mot) != 1:
              raise SystemExit(f'Expected exactly one MOT authority persist function, found {text.count(old_mot)}')
          text = text.replace(old_mot, new_mot, 1)

          old_cloud = "async function persistFleetCloudSnapshot(){if(!remoteClient)return false;try{var snap=fleetSnapshot(),res=await remoteClient.from('workshop_settings').upsert({id:fleetCloudStateId,value:snap,updated_at:snap.updated_at},{onConflict:'id'});if(res.error)throw res.error;try{localStorage.setItem('vecta:fleet:cloud-updated:v77',snap.updated_at)}catch(e){}return true}catch(e){console.warn('Fleet cloud snapshot save failed',e);return false}}"
          new_cloud = "var fleetCloudLastPersistedPayload=null;\nasync function persistFleetCloudSnapshot(){if(!remoteClient)return false;try{var snap=fleetSnapshot(),payload=JSON.stringify({version:snap.version,vehicles:snap.vehicles,plans:snap.plans,completions:snap.completions,customers:snap.customers,deletedRegistrations:snap.deletedRegistrations,removedMaintenance:snap.removedMaintenance});if(payload===fleetCloudLastPersistedPayload)return true;var res=await remoteClient.from('workshop_settings').upsert({id:fleetCloudStateId,value:snap,updated_at:snap.updated_at},{onConflict:'id'});if(res.error)throw res.error;fleetCloudLastPersistedPayload=payload;try{localStorage.setItem('vecta:fleet:cloud-updated:v77',snap.updated_at)}catch(e){}return true}catch(e){console.warn('Fleet cloud snapshot save failed',e);return false}}"
          if text.count(old_cloud) != 1:
              raise SystemExit(f'Expected exactly one fleet cloud persist function, found {text.count(old_cloud)}')
          text = text.replace(old_cloud, new_cloud, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify patch invariants
        shell: python
        run: |
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert "table:'workshop_settings'},scheduleCloudRefresh" not in text
          assert 'fleetMotAuthorityLastPersisted' in text
          assert 'fleetCloudLastPersistedPayload' in text
          assert "table:'jobs'},scheduleCloudRefresh" in text
          assert "table:'tasks'},scheduleCloudRefresh" in text
          print('Performance-only patch verified')

      - name: Commit fix
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Stop workshop settings sync feedback loop"
          git push
