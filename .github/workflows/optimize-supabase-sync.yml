name: Optimize Supabase sync

on:
  push:
    paths:
      - '.github/workflows/optimize-supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reduce redundant Supabase refreshes
        shell: python
        run: |
          from pathlib import Path

          path = Path('script2.js')
          text = path.read_text(encoding='utf-8')

          settings_subscription = "    .on('postgres_changes',{event:'*',schema:'public',table:'workshop_settings'},refreshCloudAndRender)\n"
          if text.count(settings_subscription) != 1:
              raise SystemExit(f'Expected exactly one workshop_settings realtime subscription, found {text.count(settings_subscription)}')
          text = text.replace(settings_subscription, '', 1)

          old_timer = "cloudSyncTimer=setInterval(function(){if(document.visibilityState==='visible')refreshCloudAndRender()},3000);"
          new_timer = "cloudSyncTimer=setInterval(function(){if(document.visibilityState==='visible')refreshCloudAndRender()},60000);"
          if text.count(old_timer) != 1:
              raise SystemExit(f'Expected exactly one 3-second cloud poll, found {text.count(old_timer)}')
          text = text.replace(old_timer, new_timer, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit optimization
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add script2.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Reduce redundant Supabase polling"
          git push
