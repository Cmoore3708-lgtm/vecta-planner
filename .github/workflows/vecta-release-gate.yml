name: VECTA Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'safeguards/**', 'amendment/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vecta-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workshop safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Enforce single service-worker update owner
        run: |
          test "$(grep -c "serviceWorker.register(" index.html)" -eq 1
          test "$(grep -c "addEventListener('controllerchange'" index.html)" -eq 1
          test ! -e service-worker.js
