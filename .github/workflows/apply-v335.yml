name: Apply V335 self-healing service cycle repair
on:
  push:
    paths:
      - '.github/workflows/apply-v335.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply repair
        run: |
          git apply --check .vecta/v335.patch
          git apply .vecta/v335.patch
          rm .vecta/v335.patch .github/workflows/apply-v335.yml
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Exclude generated build output
        run: |
          git restore --worktree dist
          git clean -fd -- dist
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair stale service and six-month due cycles"
          git push
