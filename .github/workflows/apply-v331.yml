name: Apply V331 Fleet alignment
on:
  push:
    paths:
      - '.github/workflows/apply-v331.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply alignment
        run: |
          git apply --check .vecta/v331.patch
          git apply .vecta/v331.patch
          rm .vecta/v331.patch .github/workflows/apply-v331.yml
      - name: Verify alignment
        run: |
          npm ci
          npm test
          node --test tests/finance-integrity.mjs
          npm run build
          git restore --worktree dist
          git clean -fd -- dist
      - name: Commit alignment
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Fleet email and work due columns"
          git push
