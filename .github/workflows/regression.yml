name: VECTA regression safety

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - safety/regression-foundation

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
