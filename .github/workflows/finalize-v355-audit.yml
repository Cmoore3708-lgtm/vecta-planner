name: Finalize V355 audit branch

on:
  push:
    branches:
      - audit/system-simplification-v355

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited index changes
        run: |
          base64 -d .audit/index.patch.gz.b64 | gzip -d > /tmp/vecta-index.patch
          git apply --check /tmp/vecta-index.patch
          git apply /tmp/vecta-index.patch
          rm .audit/index.patch.gz.b64
          rm .github/workflows/finalize-v355-audit.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Commit verified final tree
        run: |
          git config user.name "VECTA audit finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize V355 system simplification audit"
          git push
