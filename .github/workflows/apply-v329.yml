name: Apply V329 fleet and invoice fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v329.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply release patch
        run: |
          git apply --check .vecta/v329.patch
          git apply .vecta/v329.patch
          rm .vecta/v329.patch .github/workflows/apply-v329.yml
      - name: Verify release
        run: |
          npm ci
          npm test
          node --test tests/finance-integrity.mjs
          npm run build
          git restore --worktree dist
          git clean -fd -- dist
      - name: Commit release
        run: |
          git config user.name "Vecta maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix fleet service cycles and invoice display"
          git push
