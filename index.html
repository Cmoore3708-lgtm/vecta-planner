<script id="v254-authoritative-mot-override">
/* V254 CRITICAL MOT SAFETY FIX
   The live government MOT result is authoritative.
   - Every Fleet vehicle with an ACTIVE MOT maintenance plan is checked, regardless of the locally stored due date.
   - A live date may move the local date BACKWARDS or forwards. This is essential when bad local completion data
     has incorrectly pushed an MOT into a future year.
   - A Service completion must never make a vehicle ineligible for an MOT lookup.
   - Removing/pausing the MOT maintenance plan remains the only way to remove a vehicle from MOT monitoring. */
(function(){
'use strict';
function v254Iso(value){
  value=String(value||'').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(value)?value:'';
}
function v254MotPlan(vehicle){
  if(!vehicle)return null;

    return p&&p.vehicleId===vehicle.id&&p.status==='Active'&&/\bmot\b/i.test(String(p.type||''));
  })[0]||null;
}

    var known=v254Iso(window.v234LatestMotExpiry(data));
    if(known)return known;
  }
  var values=[];
  function add(v){v=v254Iso(v);if(v)values.push(v)}

  (Array.isArray(data.motTests)?data.motTests:[]).forEach(function(t){
    add(t&&t.expiryDate);add(t&&t.expiry_date);add(t&&t.motExpiryDate);add(t&&t.mot_expiry_date);
  });

}
async function v254FetchFresh(reg){
  reg=typeof normReg==='function'?normReg(reg||''):String(reg||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!reg)throw new Error('Registration missing');
  var response=await fetch('/api/vehicle-lookup?reg='+encodeURIComponent(reg)+'&manual=1&_ts='+Date.now(),{
    cache:'no-store',headers:{Accept:'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}

    try{
      var data=await v254FetchFresh(v.registration||'');checked++;
      var fresh=v254LatestGovernmentExpiry(data),plan=v254MotPlan(v);

})();

<script id="v255-all-mot-records-authoritative-manual-check">
/* V255 MOT RECONCILIATION CORRECTION
   Product rule:
   1) Manual MOT check must inspect EVERY Fleet vehicle that currently has an ACTIVE MOT maintenance record.
   2) No date-window, fleet-group or road-going filter is allowed.
   3) Government MOT due data overwrites local MOT due data in either direction.
   4) MOT completion history accidentally created from a service-only job is removed.
   5) The visible manual button always uses this implementation, bypassing all legacy 60-day handlers. */
(function(){
'use strict';

function v255Iso(value){
  value=String(value||'').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(value)?value:'';
}
function v255NormReg(value){
  return typeof normReg==='function'?normReg(value||''):String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function v255IsMotPlan(plan){
  if(!plan)return false;

  return /\bmot\b/i.test(String(plan.type||''));
}
function v255State(){
  if(typeof window.__vectaFleetState==='function')return window.__vectaFleetState();

}
function v255ActiveMotPlans(vehicleId){

  return (state.plans||[]).filter(function(plan){
    return plan && String(plan.vehicleId)===String(vehicleId) && String(plan.status||'Active')==='Active' && v255IsMotPlan(plan);
  }).sort(function(a,b){
    var ad=typeof fleetDate==='function'?String(fleetDate(a)||''):String(a.currentDueDate||'');

  });
}
function v255CandidateVehicles(){

<script id="v264-dvsa-mot-single-source-of-truth">

      motSnapshots.forEach(function(s){s.p.currentDueDate=s.currentDueDate;s.p.dueDate=s.dueDate;s.p.targetMonth=s.targetMonth;s.p.status=s.status;s.p.notes=s.notes;s.p.type=s.type;s.p.intervalMonths=s.intervalMonths;});

<script id="v311-mot-completion-bridge">
/* V311 — MOT completion bridge
   A newly passed MOT can legitimately remain on the government's previous expiry
   for a short period. Workshop-confirmed completion clears the CURRENT due cycle
   without inventing/replacing the authoritative government expiry date. */
(function(){
'use strict';

  if(!j)return false;
  var s=String(j.status||'').toLowerCase().replace(/\s+/g,'_');
  return s==='completed'||s==='complete'||s==='ready_to_invoice'||s==='ready_for_invoice'||s==='invoiced'||s==='invoice_created'||j.archived===true||!!j.completed_at||!!j.completedAt;
}
function doneDate(j){return iso(j&&j.completed_at)||iso(j&&j.completedAt)||iso(j&&j.booking_date)||iso(j&&j.updated_at);}
function strictMotJob(j){
  if(!j)return false;
  var vals=[];
  if(Array.isArray(j.job_types))vals=vals.concat(j.job_types);
  if(j.job_type)vals.push(j.job_type);
  if(j.type)vals.push(j.type);

    return String(v||'').split(/\|\||\+|\/|,/).some(function(t){return /^\s*MOT\s*$/i.test(t);});

function vehicleForPlan(plan){return (fleetVehicles||[]).find(function(v){return v&&String(v.id)===String(plan&&plan.vehicleId);})||null;}

install();

    applyFleetCloudSnapshot=function(){var r=oldApply.apply(this,arguments);install();setTimeout(function(){install();try{if(typeof render==='function'&&view==='fleet')render();}catch(e){}},0);return r;};
