<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approve additional work | Vecta</title><style>body{margin:0;background:#090d12;color:#111;font-family:Arial,sans-serif;padding:24px}.box{max-width:680px;margin:30px auto;background:white;border-radius:20px;overflow:hidden}.head{background:#151a20;color:white;padding:28px}.head b{color:#ef3340;font-size:28px}.main{padding:28px}.item{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid #e5e7eb}.total{font-size:24px;font-weight:900;text-align:right;margin:20px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{padding:15px;border:0;border-radius:10px;font-weight:900;font-size:16px}.yes{background:#167647;color:white}.no{background:#e5e7eb}.status{padding:18px;border-radius:10px;background:#f3f4f6;font-weight:800}@media(max-width:600px){.actions{grid-template-columns:1fr}}</style></head><body><div class="box"><div class="head"><b>VECTA</b><p>Additional work authorisation</p></div><div class="main" id="app">Loading…</div></div><script>const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{let r=await fetch('/api/additional-work?token='+encodeURIComponent(token||'')),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load');let items=(d.items||[]).map(x=>`<div class="item"><span>${esc(x.description)}</span><b>£${Number(x.price||0).toFixed(2)}</b></div>`).join('');app.innerHTML=`<h1>${esc(d.registration)} · ${esc(d.vehicle)}</h1><p>Hi ${esc(d.customer_name||'')}, please review the additional work below.</p>${items}<div class="total">Total: £${Number(d.total||0).toFixed(2)}</div>${d.status==='pending'?'<div class="actions"><button class="yes" onclick="decide(\'approved\')">Approve work</button><button class="no" onclick="decide(\'declined\')">Decline work</button></div>':`<div class="status">This request has already been ${esc(d.status)}.</div>`}`}catch(e){app.innerHTML=`<div class="status">${esc(e.message)}</div>`}}async function decide(decision){document.querySelectorAll('button').forEach(b=>b.disabled=true);let r=await fetch('/api/additional-work',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,decision})}),d=await r.json();if(!r.ok){alert(d.error||'Unable to save');return load()}app.innerHTML=`<div class="status">Thank you. You have ${decision==='approved'?'approved':'declined'} the additional work. Vecta Motors has been updated.</div>`}load();</script></body></html>
