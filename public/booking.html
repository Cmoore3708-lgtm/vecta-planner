<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book with Vecta Motors</title><style>
:root{--red:#d7192d;--ink:#101722;--muted:#667085;--line:#e5e7eb;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#0b111b,#232b36);color:var(--ink);min-height:100vh;padding:24px}.shell{max-width:900px;margin:auto}.brand{display:flex;align-items:center;gap:16px;color:#fff;margin:0 0 18px}.logo{font-size:42px;font-weight:1000;letter-spacing:-2px;color:#ef3340}.brand span{display:block;color:#cbd5e1;font-size:14px}.card{background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.3);overflow:hidden}.top{padding:30px 34px 18px}.top h1{margin:0 0 8px;font-size:32px}.top p{margin:0;color:var(--muted);line-height:1.5}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 34px}.progress i{height:5px;background:#e5e7eb;border-radius:99px}.progress i.on{background:var(--red)}.step{padding:28px 34px 34px;min-height:470px}.kicker{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.12em}.step h2{font-size:28px;margin:8px 0 8px}.step>p{color:var(--muted);margin:0 0 24px}.grid2,.grid3{display:grid;gap:15px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:13px;font-weight:800;margin-bottom:14px}input,select,textarea{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}.reg{text-transform:uppercase;background:#ffd83d;font-size:22px;font-weight:900;letter-spacing:1px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.type{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.type.on{background:#111827;color:#fff;border-color:#111827}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:13px;border-radius:10px;color:#9a3412;font-weight:700}.review{display:grid;gap:12px}.review div{padding:15px;border:1px solid var(--line);border-radius:12px}.review small{display:block;color:var(--muted);margin-bottom:5px}.actions{display:flex;justify-content:space-between;padding:18px 34px;border-top:1px solid var(--line);background:#fafafa}.actions button{border:0;border-radius:10px;padding:13px 20px;font-weight:900}.primary{background:var(--red);color:#fff}.secondary{background:#e5e7eb}.primary:disabled{opacity:.45}.success{text-align:center;padding:70px 30px}.success h1{font-size:38px}.success strong{display:block;margin:22px auto 0;max-width:620px;background:#fff7ed;border:1px solid #fed7aa;padding:14px;border-radius:10px}@media(max-width:700px){body{padding:0;background:#fff}.card{border-radius:0;box-shadow:none}.brand{background:#101722;margin:0;padding:18px}.top,.step,.actions{padding-left:20px;padding-right:20px}.progress{padding:0 20px}.grid2,.grid3,.types{grid-template-columns:1fr}.step{min-height:auto}}
</style></head><body><div class="shell"><div class="brand"><div class="logo">VECTA</div><div><b>Vehicle servicing & repairs</b><span>Online booking request</span></div></div><div class="card" id="app"></div></div><script>
const state={step:1,form:{customer_name:'',email:'',phone:'',registration:'',vehicle:'',mileage:'',job_types:[],work_required:'',preferred_date_1:'',preferred_date_2:'',preferred_date_3:'',completion_deadline:'',contact_preference:'Email'}};const types=['Service','MOT','Brakes','Diagnostics / warning light','Tyres','Repair','Other'];const app=document.getElementById('app');const min=new Date(Date.now()+86400000).toISOString().slice(0,10);function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function valid(){let f=state.form;if(state.step===1)return f.registration.trim()&&f.vehicle.trim();if(state.step===2)return f.job_types.length&&f.work_required.trim();if(state.step===3)return f.preferred_date_1;if(state.step===4)return f.customer_name.trim()&&f.email.trim()&&f.phone.trim();return true}function bind(){document.querySelectorAll('[data-field]').forEach(el=>el.oninput=e=>{state.form[el.dataset.field]=e.target.value;if(el.dataset.field==='registration')e.target.value=e.target.value.toUpperCase();renderActions()});document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{let t=el.dataset.type;state.form.job_types=state.form.job_types.includes(t)?state.form.job_types.filter(x=>x!==t):[...state.form.job_types,t];render()})}function renderActions(){let a=document.getElementById('actions');if(!a)return;a.innerHTML=`${state.step>1?'<button class="secondary" id="back">Back</button>':'<span></span>'}${state.step<5?`<button class="primary" id="next" ${valid()?'':'disabled'}>Continue</button>`:`<button class="primary" id="send">Send booking request</button>`}`;if(document.getElementById('back'))document.getElementById('back').onclick=()=>{state.step--;render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{state.step++;render()};if(document.getElementById('send'))document.getElementById('send').onclick=submit}function stepHtml(){let f=state.form;if(state.step===1)return `<span class="kicker">STEP 1 OF 5</span><h2>Your vehicle</h2><p>Enter the vehicle details so we know exactly what is coming into the workshop.</p><label>Registration number *<input class="reg" data-field="registration" value="${esc(f.registration)}" placeholder="AB12 CDE"></label><div class="grid2"><label>Make and model *<input data-field="vehicle" value="${esc(f.vehicle)}" placeholder="Nissan Qashqai"></label><label>Current mileage<input data-field="mileage" value="${esc(f.mileage)}" placeholder="42,000"></label></div>`;if(state.step===2)return `<span class="kicker">STEP 2 OF 5</span><h2>Work required</h2><p>Select everything that applies, then tell us what you need us to investigate or complete.</p><div class="types">${types.map(t=>`<button class="type ${f.job_types.includes(t)?'on':''}" data-type="${t}">${t}</button>`).join('')}</div><label>Describe the work or symptoms *<textarea data-field="work_required" placeholder="Warning lights, noises, faults or work required...">${esc(f.work_required)}</textarea></label>`;if(state.step===3)return `<span class="kicker">STEP 3 OF 5</span><h2>Preferred dates</h2><p>Provide up to three suitable weekdays. We will confirm one after checking workshop capacity.</p><div class="grid3"><label>First choice *<input type="date" min="${min}" data-field="preferred_date_1" value="${f.preferred_date_1}"></label><label>Second choice<input type="date" min="${min}" data-field="preferred_date_2" value="${f.preferred_date_2}"></label><label>Third choice<input type="date" min="${min}" data-field="preferred_date_3" value="${f.preferred_date_3}"></label></div><label>Need it completed by a particular time?<input data-field="completion_deadline" value="${esc(f.completion_deadline)}" placeholder="For example: before the end of my shift"></label><div class="notice">Submitting preferred dates does not confirm your booking.</div>`;if(state.step===4)return `<span class="kicker">STEP 4 OF 5</span><h2>Your details</h2><div class="grid2"><label>Full name *<input data-field="customer_name" value="${esc(f.customer_name)}"></label><label>Telephone *<input type="tel" data-field="phone" value="${esc(f.phone)}"></label></div><label>Email address *<input type="email" data-field="email" value="${esc(f.email)}"></label><label>Preferred contact method<select data-field="contact_preference"><option>Email</option><option>Telephone</option><option>WhatsApp</option></select></label>`;return `<span class="kicker">STEP 5 OF 5</span><h2>Review your request</h2><div class="review"><div><small>Vehicle</small><b>${esc(f.registration)} · ${esc(f.vehicle)}</b></div><div><small>Work required</small><b>${esc(f.job_types.join(', '))}</b><p>${esc(f.work_required)}</p></div><div><small>Preferred dates</small><b>${[f.preferred_date_1,f.preferred_date_2,f.preferred_date_3].filter(Boolean).map(esc).join(' · ')}</b></div><div><small>Contact</small><b>${esc(f.customer_name)}</b><p>${esc(f.email)} · ${esc(f.phone)}</p></div></div>`}function render(){app.innerHTML=`<div class="top"><h1>Book your vehicle into Vecta Motors</h1><p>Tell us what you need and provide up to three preferred dates.</p></div><div class="progress">${[1,2,3,4,5].map(n=>`<i class="${n<=state.step?'on':''}"></i>`).join('')}</div><div class="step">${stepHtml()}</div><div class="actions" id="actions"></div>`;bind();renderActions()}async function submit(){let b=document.getElementById('send');b.disabled=true;b.textContent='Sending...';try{let r=await fetch('/api/website-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.form)});if(!r.ok)throw new Error();app.innerHTML='<div class="success"><div class="logo">VECTA</div><h1>Thank you</h1><p>We have received your booking request. We will review your preferred dates and email you with a confirmed date and approximate cost.</p><strong>Your vehicle is not booked in until you receive confirmation from Vecta Motors.</strong></div>'}catch(e){alert('We could not send your request. Please try again or contact Vecta Motors.');b.disabled=false;b.textContent='Send booking request'}}render();
</script></body></html>
