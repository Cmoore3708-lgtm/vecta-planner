let bookingSubmission = null;
async function sendBookingRequest(payload){
 const signature=JSON.stringify(payload);
 if(!bookingSubmission||bookingSubmission.signature!==signature)bookingSubmission={signature,id:crypto.randomUUID()};
 const body=JSON.stringify({...payload,request_id:bookingSubmission.id});
 for(let attempt=0;attempt<3;attempt++){
  let response;
  try{
   response=await fetch('/api/website-booking',{method:'POST',headers:{'Content-Type':'application/json'},body,signal:AbortSignal.timeout(25000)});
   const data=await response.json();
   if(response.ok&&data.ok&&data.request_id)return data;
   if(![500,502,503,504].includes(response.status))throw new Error(data.error||'Unable to send your booking');
  }catch(error){
   if(response&&![500,502,503,504].includes(response.status))throw error;
   if(!response&&!['TypeError','AbortError','TimeoutError'].includes(error.name))throw error;
  }
  if(attempt<2)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
 }
 throw new Error('The connection was interrupted. Your details are still here. Please try again; repeating this submission will not create a duplicate request.');
}

function calendarEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');}
function bookingCalendarContent(date,requestId){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return '';
 const start=new Date(date+'T00:00:00Z');if(!Number.isFinite(start.getTime())||start.toISOString().slice(0,10)!==date)return '';
 const end=new Date(start);end.setUTCDate(end.getUTCDate()+1);
 const f=state.form,work=f.job_types.map(type=>type==='Service'?(f.service_choice||type):type==='Other'?'Something else':type).join(', ');
 const description=[f.vehicle,work,f.work_required,f.job_types.includes('Tyres')?`Tyres: ${f.tyre_size} · ${f.tyre_choice} · Quantity ${f.tyre_quantity||1}`:'','Please drop your car off before you start your shift.','Before 8 am: park in a workshop parking bay and leave your keys through the key-drop letterbox.','Directions: https://maps.app.goo.gl/M3d34Pt96byKtDQV6?g_st=ic'].filter(Boolean).join('\n');
 const compact=value=>value.replace(/-/g,''),uid=String(requestId||f.registration+'-'+date).replace(/[^a-zA-Z0-9_.-]/g,'_');
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vecta Motors//Booking//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid+'@vectamotors.co.uk','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),'DTSTART;VALUE=DATE:'+compact(date),'DTEND;VALUE=DATE:'+compact(end.toISOString().slice(0,10)),'SUMMARY:'+calendarEscape('Vecta Motors · '+f.registration+' · '+work),'LOCATION:'+calendarEscape('Vecta Motors, Contractors Compound, Nissan Sunderland'),'DESCRIPTION:'+calendarEscape(description),'STATUS:CONFIRMED','TRANSP:TRANSPARENT','END:VEVENT','END:VCALENDAR'];
 // Fold at 75 UTF-8 bytes so long vehicle/work descriptions import correctly.
 const fold=line=>{let output='',row='',bytes=0;for(const char of line){const size=encodeURIComponent(char).replace(/%[A-F\d]{2}|./gi,'x').length;if(bytes+size>75){output+=row+'\r\n';row=' ';bytes=1;}row+=char;bytes+=size;}return output+row;};
 return lines.map(fold).join('\r\n')+'\r\n';
}

 const calendar=bookingCalendarContent(date,requestId),filename='Vecta-'+String(state.form.registration||'booking').replace(/[^a-zA-Z0-9-]/g,'')+'-'+date+'.ics';
 return `<div class="receipt-actions" aria-label="Booking shortcuts">${calendar?`<a class="receipt-calendar" href="/api/booking-calendar?${esc(new URLSearchParams({date,registration:state.form.registration,work:state.form.job_types.map(t=>t==='Service'?(state.form.service_choice||t):t).join(', '),id:String(requestId||'')}).toString())}"><span aria-hidden="true">＋</span> Add to calendar</a>`:''}<a class="receipt-directions" href="https://maps.app.goo.gl/M3d34Pt96byKtDQV6?g_st=ic" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">↗</span> Get directions</a></div>${calendar?'<p class="calendar-note">Open the calendar file, then tap Add or Save to confirm the all-day booking reminder.</p>':''}`;
}
async function submit(){let b=document.getElementById('send');b.disabled=true;b.textContent=state.form.appointment_date?'Booking…':'Sending…';try{let f=state.form;f.estimated_hours=estimateHours();let d=await sendBookingRequest({...f,customer_note:(!f.job_types.includes('Tyres')&&f.parts_range?`[[PARTS_RANGE:${f.parts_range}]]`:''),approximate_cost:estimateCost(),engine_size:serviceEngineSize(),job_types:f.job_types.map(x=>x==='Service'?(f.service_choice||x):x),work_required:(f.job_types.includes('Service')&&f.mileage_unknown?'Current mileage unknown. Check mileage on arrival and carry out the appropriate manufacturer-recommended service.\n\n':'')+(f.job_types.includes('MOT')&&f.job_types.includes('Service')?'MOT + Service offer: £5 discount.'+(['Full Service','Major Service'].includes(f.service_choice)?' Car clean included.':'')+'\n\n':'')+(isNissanVehicle()?`NEVOS vehicle: ${f.nevos_vehicle==='yes'?'YES':'NO'}\n\n`:'' )+(f.inspect_mot_advisories==='yes'&&f.mot_advisories.length?`MOT Advisories, customer would like these done: ${f.mot_advisories.join('; ')}\n\n`:'' )+(f.job_types.includes('Tyres')&&f.tyre_choice?tyreBookingDescription()+'\n\n':'' )+(f.work_required.trim()||f.job_types.map(x=>x==='Service'?(f.service_choice||x):x).join(', '))});app.innerHTML=`<div class="success"><h1>Booking confirmed</h1>${bookingConfirmationSummaryHtml()}<p>Appointment: <b>${prettyDate(d.date)}</b>.</p><strong class="booking-confirmed">Your booking is confirmed. We’ll contact you if we need to discuss any details.</strong>${bookingReceiptActionsHtml(d.date,d.request_id)}<div class="final-reminders"><div class="final-reminder important"><b>Remember:</b> Leave your Service book and locking wheel nut key on the passenger seat.</div><div class="final-reminder dropoff-reminder">If you’re leaving your car before 8 am, park in one of the parking bays and put your keys through the key drop letterbox.</div></div></div>`;VectaVehicleImage.mount();applyConfirmationCopy()}catch(e){b.disabled=false;b.textContent='Confirm booking';alert('We could not complete your booking: '+e.message)}}


function daysTo(iso){if(!iso)return null;let a=new Date();a.setHours(0,0,0,0);let b=new Date(iso+'T00:00:00');return Math.ceil((b-a)/86400000)}
function estimateHours(){let f=state.form,h=0;if(f.job_types.includes('Service'))h+=f.service_choice==='Major Service'?2.5:f.service_choice==='Full Service'?1.5:1;if(f.job_types.includes('MOT'))h+=1;if(f.job_types.some(x=>/Diagnostics/i.test(x)))h+=2;if(f.job_types.includes('Brakes'))h+=1.5;if(f.job_types.includes('Tyres'))h+=1.5;if(f.job_types.includes('Other'))h+=1;return Math.max(.5,Math.min(8,h||1))}
function estimateCost(){let f=state.form,total=0,band=serviceGuidePrices(serviceEngineSize());if(f.job_types.includes('Service')&&band&&!band.individual){if(f.service_choice==='Oil & Filter Change')total+=band.oil;else if(f.service_choice==='Full Service')total+=band.full;else if(f.service_choice==='Major Service')total+=band.major}if(f.job_types.includes('MOT'))total+=65;if(f.job_types.includes('MOT')&&f.job_types.includes('Service')&&band&&!band.individual)total-=5;return total||null}
function recommendationsHtml(){let f=state.form,html='',mot=daysTo(f.mot_due);if(mot!==null&&mot>=0&&mot<=28&&!isMotBooking()){html+=`<div class="recommend-box"><span class="combined-badge">RECOMMENDED</span><strong>Your MOT is due ${mot===0?'today':`in ${mot} days`}.</strong><p>Would you like us to complete the MOT during the same visit? Combining it now saves another trip.</p><button type="button" data-add-recommendation="MOT">Add MOT · £65</button></div>`}if(f.latest_service_date&&!f.job_types.includes('Service')&&f.nevos_vehicle!=='yes'){let age=-daysTo(f.latest_service_date);if(age>=330)html+=`<div class="recommend-box"><span class="combined-badge">MAINTENANCE DUE</span><strong>Your last recorded service with us was ${prettyDate(f.latest_service_date)}.</strong><p>It looks like your annual service is due or approaching. Add a service and we will show the correct guide price for your engine size.</p><button type="button" data-add-recommendation="Service">Add a service</button></div>`}return html}
async function recogniseCustomerByRegistration(reg){state.customer_recognition_status='checking';state.form.returning_choice='';state.form.customer_found=false;state.customer_lookup_error='';render();try{let r=await fetch('/api/customer-recognition',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registration:reg})}),d=await r.json().catch(()=>({}));if(state.form.registration.toUpperCase().replace(/[^A-Z0-9]/g,'')!==reg)return;state.customer_recognition_status=d.recognised?'recognised':'not_found';if(d.recognised)state.form.returning_choice='yes';render()}catch(e){state.customer_recognition_status='error';render()}}
function scheduleCustomerLookup(){clearTimeout(state.customerTimer);let c=(state.form.returning_contact||'').trim();if(c.length<5){state.form.customer_found=false;state.customer_lookup_error='';updateReturningStatus();return}state.customerTimer=setTimeout(()=>findCustomer(true),650)}
function updateReturningStatus(){let el=document.getElementById('returningStatus');if(!el)return;el.className='returning-status '+(state.form.customer_found?'ok':state.customer_lookup_error?'error':'');el.textContent=state.form.customer_found?`Welcome back, ${state.form.customer_name}. Your saved details have been loaded.`:state.customer_lookup_error||'We’ll check automatically as you type.';renderActions()}
async function findCustomer(silent=false){let c=(state.form.returning_contact||'').trim();if(!c)return;try{let r=await fetch('/api/customer-history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registration:state.form.registration,contact:c})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.found)throw new Error('Those details do not match our records. Check them or select No below.');state.form.customer_found=true;state.form.returning_choice='yes';state.form.customer_name=d.customer?.name||'';state.form.phone=d.customer?.phone||'';state.form.email=d.customer?.email||'';state.form.customer_vehicles=d.vehicles||[];state.form.latest_service_date=d.latestServiceDate||'';state.customer_lookup_error='';render()}catch(e){state.form.customer_found=false;state.customer_lookup_error=e.message||'Unable to retrieve your details';if(!silent)alert(state.customer_lookup_error);updateReturningStatus()}}
async function fetchAvailability(){try{let f=state.form;f.estimated_hours=estimateHours();let r=await fetch('/api/availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_types:f.job_types.map(x=>x==='Service'?(f.service_choice||x):x),service_choice:f.service_choice,estimated_hours:f.estimated_hours})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Availability unavailable');let mot=isMotBooking();f.available_slots=d.slots||[];if(mot){let chosen=f.available_slots.find(s=>s.date===f.appointment_date);if(f.appointment_date&&!chosen){f.appointment_date='';f.appointment_time='';f.technician=''}else if(chosen){f.appointment_time=chosen.time;f.technician=chosen.technician}if(!state.mot_calendar_month&&f.available_slots.length)state.mot_calendar_month=monthKey(f.available_slots[0].date)}else{let chosen=f.available_slots.find(s=>s.date===f.appointment_date&&s.time===f.appointment_time);if(f.appointment_date&&!chosen){f.appointment_date='';f.appointment_time='';f.technician=''}}state.availability_loading=false;render()}catch(e){state.form.available_slots=[];state.availability_loading=false;render()}}
function bindV137(){document.querySelectorAll('[data-returning-choice]').forEach(x=>x.onclick=()=>{let choice=x.dataset.returningChoice;state.form.returning_choice=choice;state.form.customer_found=false;state.form.returning_contact='';state.customer_lookup_error='';if(choice==='no'){state.customer_recognition_status='not_found';state.form.customer_name='';state.form.phone='';state.form.email=''}render()});document.querySelectorAll('[data-add-recommendation]').forEach(x=>x.onclick=()=>{let t=x.dataset.addRecommendation;if(t==='MOT'&&!state.form.job_types.includes('MOT')){state.form.job_types.push('MOT');state.form.appointment_date='';state.form.appointment_time='';state.mot_calendar_month='';}if(t==='Service'&&!state.form.job_types.includes('Service'))state.form.job_types.push('Service');render()});document.querySelectorAll('[data-mot-date]').forEach(x=>x.onclick=()=>{let s=state.form.available_slots[Number(x.dataset.motDate)];if(!s)return;state.form.appointment_date=s.date;state.form.appointment_time=s.time;state.form.technician=s.technician;render()});document.querySelectorAll('[data-mot-month]').forEach(x=>x.onclick=()=>{if(x.disabled)return;state.mot_calendar_month=x.dataset.motMonth;render()});document.querySelectorAll('[data-change-mot-date]').forEach(x=>x.onclick=()=>{state.form.appointment_date='';state.form.appointment_time='';state.form.technician='';render()});}
