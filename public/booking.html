<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book with Vecta</title><style>
:root{--red:#d7192d;--ink:#101722;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#05080d,#0b1018 48%,#141a23);color:var(--ink);min-height:100vh;padding:24px}.shell{max-width:900px;margin:auto}.brand{display:flex;align-items:center;gap:16px;color:#fff;margin:0 0 18px}.logo{font-size:42px;font-weight:1000;letter-spacing:-2px;color:#ef3340}.brand span{display:block;color:#cbd5e1;font-size:14px}.card{background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.3);overflow:hidden}.top{padding:30px 34px 18px}.top h1{margin:0 0 8px;font-size:32px}.top p{margin:0;color:var(--muted);line-height:1.5}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 34px}.progress i{height:5px;background:#e5e7eb;border-radius:99px}.progress i.on{background:var(--red)}.step{padding:28px 34px 34px;min-height:410px}.kicker{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.12em}.step h2{font-size:28px;margin:8px 0}.step>p{color:var(--muted);margin:0 0 24px}.grid2,.grid3{display:grid;gap:15px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:13px;font-weight:800;margin-bottom:14px}input,select,textarea{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}textarea{height:86px;min-height:86px;resize:vertical}.reg-label{display:block}.reg-wrap{display:flex;width:230px;max-width:100%;margin-top:7px;border:2px solid #111;border-radius:10px;overflow:hidden;background:#ffd83d}.reg-band{width:42px;flex:0 0 42px;background:#0752a5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;letter-spacing:.5px;border-right:2px solid #111}.reg{display:block;width:100%;min-width:0;margin:0;border:0!important;border-radius:0!important;text-transform:uppercase;background:#ffd83d;font-size:22px;font-weight:900;letter-s ntent:space-between;gap:16px}.vehicle-summary-main{min-width:0}.vehicle-summary .found{font-size:11px}.vehicle-summary strong{display:block;margin-top:3px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vehicle-summary-meta{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}.vehicle-summary-meta span{font-size:12px;color:#667085}.vehicle-summary-meta b{display:block;color:#172033;margin-top:2px}.review{display:grid;gap:12px}.review div{padding:15px;border:1px solid var(--line);border-radius:12px}.review small{display:block;color:var(--muted);margin-bottom:5px}.actions{display:flex;justify-content:space-between;padding:18px 34px;border-top:1px solid var(--line);background:#fafafa}.actions button{border:0;border-radius:10px;padding:13px 20px;font-weight:900}.primary{background:var(--red);color:#fff}.secondary{background:#e5e7eb}.primary:disabled{opacity:.45}.success{text-align:center;padding:70px 30px}.success h1{font-size:38px}.success strong{display:block;margin:22px auto 0;max-width:620px;background:#fff7ed;border:1px solid #fed7aa;padding:14px;border-radius:10px}.final-reminders{max-width:650px;margin:20px auto 0;display:grid;gap:12px;text-align:left}.final-reminder{padding:15px 17px;border:1px solid #d9dee7;border-radius:12px;background:#f8fafc;line-height:1.5}.final-reminder.important{border:2px solid var(--red);background:#fff7f7;font-size:16px}.final-reminder a{color:var(--red);font-weight:900;text-decoration:underline;text-underline-offset:3px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){body{padding:0;background:#070b11}.card{border-radius:0;box-shadow:none}.brand{background:#101722;margin:0;padding:18px}.top,.step,.actions{padding-left:20px;padding-right:20px}.progress{padding:0 20px}.grid2,.grid3,.facts{grid-template-columns:1fr}.types{grid-template-columns:repeat(2,minmax(0,1fr))}.type:nth-child(n){grid-column:auto;grid-row:auto}.step{min-height:auto}.reg-wrap{width:100%}.vehicle-summary{align-items:flex-start;flex-direction:column}.vehicle-summary-meta{justify-content:flex-start;gap:12px 20px}}

/* Step 2 balanced six-option layout */
.types{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.type:nth-child(n){grid-column:auto;grid-row:auto;width:100%;min-height:58px;white-space:nowrap}
.step label:has(textarea){font-size:16px;font-weight:800;letter-spacing:.01em}
.step label:has(textarea) textarea{margin-top:9px;font-size:15px;font-weight:500}
@media(max-width:700px){.types{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:24px}.type{white-space:normal}.step label:has(textarea){font-size:15px}}

.advisory-question{margin-top:12px;padding-top:12px;border-top:1px solid #f0d9a6}.advisory-question strong{display:block;font-size:14px;color:#172033;line-height:1.45}.advisory-choice{display:flex;gap:10px;margin-top:10px}.advisory-choice button{min-width:84px;padding:10px 18px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172033;font-weight:900;cursor:pointer}.advisory-choice button.selected{background:#172033;color:#fff;border-color:#172033}

.guide-price-wrap{display:grid;gap:10px;margin:-4px 0 20px}.guide-price-card{border:1px solid #cfd8e3;border-left:5px solid var(--red);border-radius:12px;background:#f8fafc;padding:15px 17px}.guide-price-card small{display:block;font-size:10px;letter-spacing:.08em;font-weight:900;color:#667085;margin-bottom:5px}.guide-price-card strong{display:block;font-size:22px;color:#101722}.guide-price-card p{margin:7px 0 0;color:#667085;font-size:13px;line-height:1.45}.guide-price-card.oil-guide{border-left-color:#20252b}.review .guide-price-wrap{margin:8px 0 0}.review .guide-price-card{padding:12px 14px}.review .guide-price-card strong{font-size:18px}

.service-picker{margin:-2px 0 22px;padding:24px;border-radius:18px;background:linear-gradient(145deg,#10151b,#171d24);border:1px solid #2b333d;box-shadow:0 18px 42px rgba(0,0,0,.18)}
.service-picker-head{margin:0 0 20px}.service-picker-head h3{margin:0 0 6px;color:#fff;font-size:25px}.service-picker-head p{margin:0;color:#bac3ce;font-size:14px;line-height:1.5}.service-picker-head b{color:#fff}

.service-option:hover{border-color:#929ba7;transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.22)}
.service-option.selected{border:2px solid var(--red);background:linear-gradient(160deg,#1b2027,#11161c);box-shadow:0 0 0 1px rgba(215,25,45,.2),0 14px 30px rgba(0,0,0,.22)}
.service-option.recommended{border-color:var(--red)}
.service-option .recommend{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,#e23644,#b91426);color:#fff;border-radius:7px;padding:7px 12px;font-size:10px;font-weight:900;letter-spacing:.06em;box-shadow:0 6px 14px rgba(215,25,45,.28)}
.service-icon{width:68px;height:68px;margin:4px auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#242b32;color:#ef3340;font-size:31px;line-height:1}
.service-title-row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}.service-option strong{display:block;font-size:20px;color:#fff;line-height:1.15}.service-option .price{font-size:25px;margin:10px 0 10px;font-weight:950;color:#ef3340}.service-option .price-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9ba5b1;font-weight:900}.service-option p{margin:5px 0;color:#c3cbd4;font-size:13px;line-height:1.5}.service-divider{height:1px;background:#3c444d;margin:15px 0 13px}.service-feature{display:flex;align-items:flex-start;gap:8px;text-align:left;color:#e6e9ed;font-size:12px;line-height:1.35;margin:8px 0}.service-feature:before{content:'✓';color:#ef3340;font-weight:950}.free-clean{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:#fff;color:#111820;font-size:9px;font-weight:950;letter-spacing:.04em;white-space:nowrap}.free-clean:before{content:'✦';color:var(--red)}
.service-advice{margin:0;border:1px solid #bd2837;background:#171a20;border-radius:12px;padding:14px 16px;color:#dbe0e6;font-size:13px;line-height:1.55}.service-advice b{color:#fff}.service-advice .advice-title{display:block;color:#fff;font-size:14px;margin-bottom:3px}.service-advice .advice-icon{color:#ef3340;font-weight:950;margin-right:6px}
@media(max-width:760px){.service-picker{padding:18px 14px}.service-options{grid-template-columns:1fr;gap:18px}.service-option{min-height:auto;padding:22px 18px}.service-option .recommend{top:-10px}.service-picker-head h3{font-size:22px}}

</style></head><body><div class="shell"><div class="brand"><div class="logo">VECTA</div><div><b>Vehicle servicing & repairs</b><span>Online booking request</span></div></div><div class="card" id="app"></div></div><script>
const state={step:1,lookup:'idle',lookupMessage:'',timer:null,form:{customer_name:'',email:'',phone:'',registration:'',vehicle:'',engine_size:'',mileage:'',mot_due:'',mot_advisories:[],inspect_mot_advisories:'',job_types:[],work_required:'',preferred_date_1:'',preferred_date_2:'',preferred_date_3:'',completion_deadline:'',contact_preference:'Email',service_choice:'',tyre_choice:''}};
const types=['Service','MOT','Diagnostics / warning light','Brakes','Tyres','Other'],app=document.getElementById('app'),min=new Date(Date.now()+86400000).toISOString().slice(0,10);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function prettyDate(s){if(!s)return'Not available';let d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}function prettyMiles(s){let n=Number(String(s||'').replace(/,/g,''));return n?`${n.toLocaleString('en-GB')} miles`:'Not recorded'}
function engineCc(value){let n=Number(String(value||'').replace(/[^0-9.]/g,''));if(!Number.isFinite(n)||n<=0)return 0;return n<20?Math.round(n*1000):Math.round(n)}
function engineLabel(value){let cc=engineCc(value);if(!cc)return'Engine size unavailable';return cc.toLocaleString('en-GB')+'cc ('+(cc/1000).toFixed(cc%1000===0?1:1)+'L)'}
function serviceGuidePrices(value){let cc=engineCc(value);if(!cc)return null;if(cc<=1200)return{band:'Up to 1.2L',oil:80,full:140,major:195};if(cc<=1600)return{band:'1.3–1.6L',oil:85,full:155,major:210};if(cc<=2000)return{band:'1.7–2.0L',oil:90,full:165,major:220};if(cc<=2500)return{band:'2.1–2.5L',oil:95,full:180,major:230};if(cc<=3000)return{band:'2.6–3.0L',oil:105,full:195,major:250};return{band:'Over 3.0L',individual:true}}

function serviceChoicePrice(choice,band){
  if(!band)return 'Price confirmed after vehicle check';
  if(band.individual)return 'Price individually';
  if(choice==='Interim Service')return `£${band.oil}`;
  if(choice==='Full Service')return `£${band.full}`;
  return `£${band.major}`;
}
function serviceOptionsHtml(){
  let f=state.form;
  if(!f.job_types.includes('Service'))return'';
  let band=serviceGuidePrices(f.engine_size);
  let engineNote=state.lookup==='success'?`These guide prices are based on ${esc(engineLabel(f.engine_size))}.`:'We will confirm the exact service price from your vehicle details.';
  const card=(choice,title,icon,desc,features,freeClean=false,recommended=false)=>`<button type="button" class="service-option ${f.service_choice===choice?'selected':''} ${recommended?'recommended':''}" data-service-choice="${choice}">${recommended?'<span class="recommend">RECOMMENDED</span>':''}<div class="service-icon">${icon}</div><div class="service-title-row"><strong>${title}</strong>${freeClean?'<span class="free-clean">FREE WASH &amp; HOOVER</span>':''}</div><div class="price-label">Guide price</div><div class="price">${serviceChoicePrice(choice,band)}</div><p>${desc}</p><div class="service-divider"></div>${features.map(x=>`<span class="service-feature">${x}</span>`).join('')}</button>`;
  return `<div class="service-picker"><div class="service-picker-head"><h3>Select a Service</h3><p>Choose the service you would like for <b>${esc(f.vehicle||f.registration||'your vehicle')}</b>. The price shown is based on the vehicle information we have.</p></div><div class="service-options">
    ${card('Interim Service','Interim Service','◒','Basic fluid top-ups and an engine oil & filter change — ideal every 6 months or 6,000 miles.',['Engine oil changed','Oil filter replaced','Basic fluid levels checked / topped up'],false,false)}
    ${card('Full Service','Full Service','✓','Our annual comprehensive service covering the key safety and service items.',['Engine oil & filter change','Brakes, filters & suspension checks','Comprehensive health check & report'],true,false)}
    ${card('Major Service','Major Service','✓','Our most in-depth scheduled service, including additional replacement items when due.',['Engine oil & filter change','All Full Service checks','Spark plugs & fuel filter where scheduled','Comprehensive health check & report'],true,true)}
  </div><div class="service-advice"><span class="advice-title"><span class="advice-icon">↻</span>Which service should I choose?</span>We recommend alternating between Full and Major services each year. If you are unsure, it is always best to start with a Major Service. Interim Service is ideal between annual services, around every 6 months or 6,000 miles. ${engineNote} Guide prices may be adjusted if your vehicle requires additional oil, specialist oil or non-standard filters.</div></div>`;
}

function tyreOptionsHtml(){
  let f=state.form;
  if(!f.job_types.includes('Tyres'))return'';
  const option=(choice,sub)=>`<button type="button" class="tyre-option ${f.tyre_choice===choice?'selected':''}" data-tyre-choice="${choice}">${choice}<small>${sub}</small></button>`;
  return `<div class="tyre-picker"><div class="tyre-picker-head"><h3>Select your tyre range</h3><p>We can supply a wide range of tyres depending on your budget. Please select an option below so we can select the appropriate tyres.</p></div><div class="tyre-options">${option('Budget','Best value option')}${option('Mid Range','Balance of price and performance')}${option('Premium','Leading premium tyre brands')}</div></div>`;
}
function pricingHtml(){let f=state.form,band=serviceGuidePrices(f.engine_size),choice=f.service_choice||'Service';return `<div class="guide-price-wrap"><div class="guide-price-card"><small>${esc(choice.toUpperCase())} · GUIDE PRICE</small><strong>${serviceChoicePrice(choice,band)}</strong><p>${band&&!band.individual?`Based on ${esc(engineLabel(f.engine_size))}.`:band&&band.individual?'We will price this vehicle individually.':'We will confirm the exact price from your vehicle details.'} Final price may vary for oil capacity, specialist oil or non-standard filters.</p></div></div>`}
function valid(){let f=state.form;if(state.step===1)return !!(f.registration.trim()||f.vehicle.trim()) && (!f.mot_advisories.length || !!f.inspect_mot_advisories);if(state.step===2)return f.job_types.length&&(!f.job_types.includes('Service')||!!f.service_choice)&&(!f.job_types.includes('Tyres')||!!f.tyre_choice)&&f.work_required.trim();if(state.step===3)return f.preferred_date_1;if(state.step===4)return f.customer_name.trim()&&f.email.trim()&&f.phone.trim();return true}
function bindAdvisoryChoices(){document.querySelectorAll('[data-advisory-choice]').forEach(el=>el.onclick=()=>{state.form.inspect_mot_advisories=el.dataset.advisoryChoice;updateLookupPanel();renderActions()})}
function updateLookupPanel(){let panel=document.getElementById('lookupPanel');if(panel){panel.innerHTML=lookupHtml();bindAdvisoryChoices()}}
function scheduleLookup(){clearTimeout(state.timer);let reg=state.form.registration.toUpperCase().replace(/[^A-Z0-9]/g,'');if(reg.length<5){state.lookup='idle';updateLookupPanel();return}state.lookup='loading';state.lookupMessage='Looking up vehicle...';updateLookupPanel();state.timer=setTimeout(()=>lookup(reg),650)}
async function lookup(reg){try{let r=await fetch('/api/vehicle-lookup?reg='+encodeURIComponent(reg)),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Vehicle not found');if(state.form.registration.toUpperCase().replace(/[^A-Z0-9]/g,'')!==reg)return;state.form.vehicle=d.vehicle||d.make||state.form.vehicle;state.form.mileage=d.latestMileage?String(d.latestMileage):state.form.mileage;state.form.mot_due=d.motExpiryDate||'';state.form.engine_size=d.engineSize||d.engine_size||d.engineCapacity||d.engine_capacity||d.cylinderCapacity||d.cylinder_capacity||'';state.form.mot_advisories=Array.isArray(d.advisories)?d.advisories:[];state.form.inspect_mot_advisories='';state.lookup='success';let vehicleInput=document.querySelector('[data-field="vehicle"]');if(vehicleInput)vehicleInput.value=state.form.vehicle;updateLookupPanel();renderActions()}catch(e){state.lookup='error';state.lookupMessage=e.message||'Lookup unavailable. Please enter the vehicle details manually.';updateLookupPanel()}}
function bind(){bindAdvisoryChoices();document.querySelectorAll('[data-field]').forEach(el=>el.oninput=e=>{let k=el.dataset.field;state.form[k]=k==='registration'?e.target.value.toUpperCase():e.target.value;if(k==='registration'){e.target.value=state.form[k];scheduleLookup()}else renderActions()});document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{let t=el.dataset.type;if(t==='Service'&&state.form.job_types.includes('Service')){state.form.job_types=state.form.job_types.filter(x=>x!=='Service');state.form.service_choice=''}else if(t==='Tyres'&&state.form.job_types.includes('Tyres')){state.form.job_types=state.form.job_types.filter(x=>x!=='Tyres');state.form.tyre_choice=''}else if(state.form.job_types.includes(t)){state.form.job_types=state.form.job_types.filter(x=>x!==t)}else{state.form.job_types=[...state.form.job_types,t]}render()});document.querySelectorAll('[data-service-choice]').forEach(el=>el.onclick=()=>{let choice=el.dataset.serviceChoice;state.form.service_choice=choice;if(!state.form.job_types.includes('Service'))state.form.job_types=[...state.form.job_types,'Service'];let serviceNames=['Interim Service','Full Service','Major Service','Oil & Filter Change'];let current=state.form.work_required.trim();if(!current||serviceNames.includes(current))state.form.work_required=choice;render()});document.querySelectorAll('[data-tyre-choice]').forEach(el=>el.onclick=()=>{state.form.tyre_choice=el.dataset.tyreChoice;render()})}
function renderActions(){let a=document.getElementById('actions');if(!a)return;a.innerHTML=`${state.step>1?'<button class="secondary" id="back">Back</button>':'<span></span>'}${state.step<5?`<button class="primary" id="next" ${valid()?'':'disabled'}>Continue</button>`:`<button class="primary" id="send">Send booking request</button>`}`;let back=document.getElementById('back'),next=document.getElementById('next'),send=document.getElementById('send');if(back)back.onclick=()=>{state.step--;render()};if(next)next.onclick=()=>{state.step++;render()};if(send)send.onclick=submit}
function lookupHtml(){let f=state.form;if(state.lookup==='loading')return `<div class="lookup loading"><span class="spinner"></span><b>${esc(state.lookupMessage)}</b></div>`;if(state.lookup==='error')return `<div class="lookup error">${esc(state.lookupMessage)}</div>`;if(state.lookup!=='success')return'';return `<div class="lookup success"><div class="found">✓ VEHICLE IDENTIFIED</div><strong class="vehicle-name">${esc(f.vehicle||f.registration)}</strong><div class="facts"><div class="fact"><small>Last MOT mileage</small><b>${prettyMiles(f.mileage)}</b></div><div class="fact"><small>MOT due</small><b>${prettyDate(f.mot_due)}</b></div></div>${f.mot_advisories.length?`<div class="advisories"><b>Latest advisories</b><ul>${f.mot_advisories.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="advisory-question"><strong>We noticed you have some outstanding advisories from your last MOT. Would you like us to have a look at them?</strong><div class="advisory-choice"><button type="button" data-advisory-choice="yes" class="${f.inspect_mot_advisories==='yes'?'selected':''}">Yes</button><button type="button" data-advisory-choice="no" class="${f.inspect_mot_advisories==='no'?'selected':''}">No</button></div></div></div>`:''}</div>`}
function vehicleSummaryHtml(){let f=state.form;if(state.lookup!=='success'||state.step===1)return'';return `<div class="vehicle-summary"><div class="vehicle-summary-main"><div class="found">✓ VEHICLE IDENTIFIED</div><strong>${esc(f.registration)} · ${esc(f.vehicle||'Vehicle')}</strong></div><div class="vehicle-summary-meta"><span>Last MOT mileage<b>${prettyMiles(f.mileage)}</b></span><span>MOT due<b>${prettyDate(f.mot_due)}</b></span><span>Engine<b>${esc(engineLabel(f.engine_size))}</b></span></div></div>`}
function stepHtml(){let f=state.form;if(state.step===1)return `<span class="kicker">STEP 1 OF 5</span><h2>Your vehicle</h2><p>Enter your registration and we will check the DVSA record automatically.</p><label class="reg-label">Registration number<div class="reg-wrap"><span class="reg-band">GB</span><input class="reg" data-field="registration" value="${esc(f.registration)}" placeholder="AB12 CDE"></div></label><div id="lookupPanel">${lookupHtml()}</div>${state.lookup==='success'?'':`<label>Make &amp; Model if not sure:<input data-field="vehicle" value="${esc(f.vehicle)}" placeholder="Nissan Qashqai"></label>`}`;if(state.step===2)return `<span class="kicker">STEP 2 OF 5</span><h2>Work required</h2><p>Select everything that applies, then give us as much information as possible.</p><div class="types">${types.map(t=>`<button class="type ${f.job_types.includes(t)?'on':''}" data-type="${t}">${t}</button>`).join('')}</div>${serviceOptionsHtml()}${tyreOptionsHtml()}<label>Describe work required/symptoms in as much detail as possible *<textarea data-field="work_required" placeholder="Include any warning lights, noises, symptoms, faults and the work you would like us to carry out...">${esc(f.work_required)}</textarea></label>`;if(state.step===3)return `<span class="kicker">STEP 3 OF 5</span><h2>Preferred dates</h2><p>Provide up to three suitable weekdays. We will confirm one after checking workshop capacity.</p><div class="grid3"><label>First choice *<input type="date" min="${min}" data-field="preferred_date_1" value="${f.preferred_date_1}"></label><label>Second choice<input type="date" min="${min}" data-field="preferred_date_2" value="${f.preferred_date_2}"></label><label>Third choice<input type="date" min="${min}" data-field="preferred_date_3" value="${f.preferred_date_3}"></label></div><label>Need it completing by a particular time?<input data-field="completion_deadline" value="${esc(f.completion_deadline)}" placeholder="For example: the time you finish your shift"></label><div class="notice">We will contact you to confirm the booking date.</div>`;if(state.step===4)return `<span class="kicker">STEP 4 OF 5</span><h2>Your details</h2><div class="grid2"><label>Full name *<input data-field="customer_name" value="${esc(f.customer_name)}"></label><label>Telephone *<input type="tel" data-field="phone" value="${esc(f.phone)}"></label></div><label>Email address *<input type="email" data-field="email" value="${esc(f.email)}"></label><label>Preferred contact method<select data-field="contact_preference"><option>Email</option><option>Telephone</option><option>WhatsApp</option></select></label>`;return `<span class="kicker">STEP 5 OF 5</span><h2>Review your request</h2><div class="review"><div><small>Vehicle</small><b>${[f.registration,f.vehicle].filter(Boolean).map(esc).join(' · ')}</b></div>${f.job_types.includes('Service')?`<div><small>Guide pricing</small>${pricingHtml()}</div>`:''}<div><small>Work required</small><b>${esc(f.job_types.join(', '))}</b><p>${esc(f.work_required)}</p></div><div><small>Preferred dates</small><b>${[f.preferred_date_1,f.preferred_date_2,f.preferred_date_3].filter(Boolean).map(esc).join(' · ')}</b></div><div><small>Contact</small><b>${esc(f.customer_name)}</b><p>${esc(f.email)} · ${esc(f.phone)}</p></div></div>`}
function render(){app.innerHTML=`<div class="top"><h1>Booking Form</h1></div><div class="progress">${[1,2,3,4,5].map(n=>`<i class="${n<=state.step?'on':''}"></i>`).join('')}</div><div class="step">${vehicleSummaryHtml()}${stepHtml()}</div><div class="actions" id="actions"></div>`;bind();renderActions()}
async function submit(){let b=document.getElementById('send');b.disabled=true;b.textContent='Sending...';try{let r=await fetch('/api/website-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state.form,job_types:state.form.job_types.map(x=>x==='Service'?(state.form.service_choice||x):x),work_required:(state.form.inspect_mot_advisories==='yes'&&state.form.mot_advisories.length?`MOT Advisories, customer would like these done: ${state.form.mot_advisories.join('; ')}\n\n`:'' )+(state.form.job_types.includes('Tyres')&&state.form.tyre_choice?`Tyre preference: ${state.form.tyre_choice}\n\n`:'' )+state.form.work_required})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to send');app.innerHTML='<div class="success"><div class="logo">VECTA</div><h1>Thank you</h1><p>We have received your booking request.</p><strong>Your vehicle is not booked in until you receive confirmation from Vecta.</strong><div class="final-reminders"><div class="final-reminder important"><b>Remember:</b> Leave your Service book and locking wheel nut key on the passenger seat.</div><div class="final-reminder"><a href="https://www.vectamotors.co.uk/find-us" target="_blank" rel="noopener noreferrer">Click <b>here</b> for directions.</a></div><div class="final-reminder">If you’re leaving your car before 8 am, park in one of the parking bays and put your keys through the key drop letterbox.</div></div></div>'}catch(e){alert('We could not send your request: '+e.message);b.disabled=false;b.textContent='Send booking request'}}render();
</script></body></html>
