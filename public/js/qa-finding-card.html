<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/js/vecta-workshop-photos.css"><style>body{font:16px system-ui;color:#19212b;margin:12px}main.main>header.top{padding:8px 0}.btn,button{padding:8px 12px;border:1px solid #b7c1cb;border-radius:7px;cursor:pointer;background:#fff}.green{background:#226542;color:white}.jobFormSection{padding:12px;border-radius:10px}h2{margin:8px 0}.modal{display:none}.modal.open{display:block}.findingBody small{margin-top:8px}label{display:block}</style></head><body><main class="main"><header class="top"><h2>Workshop Pro · Test fixture</h2></header></main><nav><button id="draft">Awaiting price</button> <button id="approved">Customer approves</button> <button id="declined">Customer declines</button></nav><div id="jobModal" class="modal open"></div><script>
const job={id:'11111111-1111-4111-8111-111111111111',registration:'TEST001',status:'in_progress'},photo='33333333-3333-4333-8333-333333333333';
let item={id:'22222222-2222-4222-8222-222222222222',job_id:job.id,registration:job.registration,message:'Replace both front tyres. The inner shoulders are worn.',status:'awaiting_price',photo_ids:[photo],mechanic_photo:false},decisions=[];
window.fetch=async(url,options)=>{const b=JSON.parse(options.body);if(b.action==='approval-queue')return Response.json({findings:item.status==='awaiting_price'?[item]:[],decisions});if(b.action==='photos-list')return Response.json({photos:[{id:photo,review_id:item.id,url:'https://brqsejjykrubxuofavuu.supabase.co/storage/v1/object/sign/job-workshop-photos/'+photo+'.jpg?token=fixture',caption:'Front passenger tyre: worn inner shoulder.',private_finding:item.status==='awaiting_price'}]});if(b.action==='approval-request'){item={...item,message:b.message,estimated_pence:Math.round(Number(b.estimate)*100),status:'pending'};return Response.json({channels:{email:'test',whatsapp:'test'}});}return Response.json({approvals:[item],whatsapp:{allowed:false}});};
const src=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(HTMLImageElement.prototype,'src',{get:src.get,set(value){src.set.call(this,String(value).includes('token=fixture')?'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260"><rect width="300" height="260" fill="#d9dee0"/><ellipse cx="150" cy="133" rx="91" ry="113" fill="#252a2c"/><ellipse cx="150" cy="133" rx="52" ry="80" fill="#6b7478"/><ellipse cx="150" cy="133" rx="31" ry="58" fill="#bac2c5"/><path d="M81 58L102 69M68 91L92 99M61 127L88 129M64 161L92 155M76 194L102 181" stroke="#a88040" stroke-width="8"/><text x="150" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">Synthetic inspection photo</text></svg>'):value);}});
function mount(){const modal=document.getElementById('jobModal');modal.innerHTML='<h2>TEST001 · Job card</h2><section class="jobWorkSection"><p>Interim Service and Tyres</p></section>';window.VectaWorkshopPhotos.mount(modal,job,true);}
window.vectaOpenFindingJob=async()=>{mount();return 'open';};
</script><script src="/js/vecta-review-queue.js"></script><script src="/js/vecta-workshop-photos.js"></script><script>mount();document.getElementById('draft').onclick=()=>{item={...item,status:'awaiting_price',estimated_pence:null};decisions=[];mount();VectaFindings.notify();};for(const status of ['approved','declined'])document.getElementById(status).onclick=()=>{item={...item,status,estimated_pence:10000,decided_at:new Date().toISOString()};decisions=[item];mount();VectaFindings.notify();};</script></body></html>
