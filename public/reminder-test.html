<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VECTA | Reminder test</title>
<style>body{margin:0;background:#f4f5f7;color:#172033;font:16px system-ui,sans-serif}main{max-width:600px;margin:8vh auto;padding:32px;background:white;border-radius:16px;box-shadow:0 12px 40px #17203312}h1{margin-top:0}.brand{color:#c8102e;font-weight:900;letter-spacing:2px}button{display:block;width:100%;padding:16px;margin:14px 0;border:0;border-radius:9px;background:#172033;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;line-height:1.6}a{color:#172033}@media(max-width:650px){main{margin:20px;padding:24px}}</style></head>
<body><main><p class="brand">VECTA</p><h1>Test booking reminders</h1><p>Both tests go only to <strong>chris@nissan-fleet.co.uk</strong> and are clearly marked TEST. No booking is created or changed.</p>
<button data-kind="nmuk">Send NMUK test — Nissan Fleet</button><button data-kind="staff">Send staff test — Vecta Motors</button>
<p id="result" role="status" aria-live="polite"></p><p>Staff replies go to chris@vectamotors.co.uk. NMUK replies go to Chris@Nissan-Fleet.co.uk.</p><a href="/">Return to Workshop Pro</a></main>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',async()=>{const buttons=document.querySelectorAll('button'),result=document.getElementById('result');buttons.forEach(b=>b.disabled=true);result.textContent='Sending test…';try{const response=await fetch('/api/fleet-nightly-refresh?task=reminder-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:button.dataset.kind})});const data=await response.json();if(!response.ok)throw Error(data.error||'Test failed.');result.textContent=data.message+'\nFrom: '+data.from+'\nProvider reference: '+data.provider_id;}catch(error){result.textContent=error.message||'Could not confirm the send. Check your inbox before trying again.';}finally{buttons.forEach(b=>b.disabled=false);}}));</script></body></html>
