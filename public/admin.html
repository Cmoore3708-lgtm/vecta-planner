<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VECTA Admin</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f4f4f2}*{box-sizing:border-box}body{margin:0}.top{background:#111;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.18em;font-size:22px}.brand b{color:#d71920}.wrap{max-width:1120px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:220px 1fr;gap:20px}.nav,.card{background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 8px 30px #0000000a}.nav{padding:10px;height:max-content}.nav button{width:100%;border:0;background:none;text-align:left;padding:13px;border-radius:9px;font-weight:700}.nav button.active{background:#111;color:#fff}.card{padding:24px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:800;margin:16px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;font:inherit}textarea{min-height:100px}.actions{display:flex;gap:10px;margin-top:22px;align-items:center}.btn{border:0;border-radius:9px;padding:12px 17px;font-weight:850;cursor:pointer}.save{background:#eee}.publish{background:#d71920;color:#fff}.status{font-size:13px;color:#666}.history{margin-top:22px;border-top:1px solid #eee;padding-top:18px}.history div{padding:8px 0;border-bottom:1px solid #f1f1f1;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.row{grid-template-columns:1fr}.top{padding:16px}}</style></head>
<body><div class="top"><div class="brand"><b>V</b>ECTA ADMIN</div><div id="version">Not published</div></div><div class="wrap"><div class="grid">
<div class="nav"><button class="active">Website</button><button disabled>Bookings · next</button><button disabled>Emails · next</button><button disabled>Workshop · next</button></div>
<div class="card"><div class="eyebrow">Website content</div><h1>Edit the public website</h1><p>Save changes as a draft first. Nothing becomes public until you press <b>Publish website</b>.</p>
<div class="row"><div><label>Hero heading</label><input id="heroTitle"></div><div><label>Hero strapline</label><input id="heroSubtitle"></div></div>
<div class="row"><div><label>Telephone</label><input id="phone"></div><div><label>Email</label><input id="email"></div></div>
<label>Opening hours</label><textarea id="hours"></textarea><label>Homepage introduction</label><textarea id="intro"></textarea>
<label>Services</label><textarea id="services" placeholder="One service per line"></textarea>
<div class="actions"><button class="btn save" onclick="saveDraft()">Save draft</button><button class="btn publish" onclick="publishSite()">Publish website</button><span class="status" id="status"></span></div>
<div class="history"><b>Recent published versions</b><div id="history"></div></div></div></div></div>
<script>
let record={draft:{}}; const $=id=>document.getElementById(id);
function values(){return{heroTitle:$('heroTitle').value,heroSubtitle:$('heroSubtitle').value,phone:$('phone').value,email:$('email').value,hours:$('hours').value,intro:$('intro').value,services:$('services').value.split('\n').map(x=>x.trim()).filter(Boolean)}}
function fill(d){for(const k of ['heroTitle','heroSubtitle','phone','email','hours','intro']) $(k).value=d?.[k]||'';$('services').value=(d?.services||[]).join('\n')}
async function load(){status('Loading…');const r=await fetch('/api/admin-website');if(!r.ok)throw Error('Could not load admin settings');const j=await r.json();record=j.record||{draft:{}};fill(record.draft);$('version').textContent='Published v'+(record.published_version||0);$('history').innerHTML=(j.history||[]).map(h=>'<div>Version '+h.version+' · '+new Date(h.created_at).toLocaleString()+'</div>').join('')||'<div>No previous versions yet.</div>';status('Ready')}
function status(t){$('status').textContent=t}
async function saveDraft(){status('Saving draft…');const r=await fetch('/api/admin-website',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft:values()})});if(!r.ok)throw Error('Draft save failed');status('Draft saved')}
async function publishSite(){await saveDraft();if(!confirm('Publish these website changes?')){status('Draft saved — not published');return}status('Publishing…');const r=await fetch('/api/admin-website',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'publish'})});if(!r.ok)throw Error('Publish failed');await load();status('Published successfully')}
window.addEventListener('unhandledrejection',e=>status(e.reason?.message||'Something went wrong'));load().catch(e=>status(e.message));
</script></body></html>
