const state={step:1,lookup:'idle',lookupMessage:'',timer:null,customerTimer:null,customer_recognition_status:'idle',customer_lookup_error:'',availability_loading:false,mot_notice_open:false,mot_calendar_month:'',general_calendar_month:'',form:{customer_name:'',email:'',phone:'',registration:'',vehicle:'',vehicle_make:'',engine_size:'',engine_size_manual:'',mileage:'',last_mot_mileage:'',last_mot_date:'',mot_due:'',mot_advisories:[],inspect_mot_advisories:'',nevos_vehicle:'',job_types:suppliedTypes.slice(),work_required:'',preferred_date_1:'',preferred_date_2:'',preferred_date_3:'',completion_deadline:'',contact_preference:'Email',service_choice:'',tyre_choice:'',tyre_size:'',parts_range:'',returning_contact:'',returning_choice:'',customer_found:false,customer_vehicles:[],latest_service_date:'',available_slots:[],appointment_date:'',appointment_time:'',technician:'',estimated_hours:1}};
const suppliedReg=(bookingParams.get('reg')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),directBooking=suppliedReg.length>=5,types=['Service','MOT','Diagnostics / warning light','Brakes','Tyres','Other'],app=document.getElementById('app'),min=new Date(Date.now()+86400000).toISOString().slice(0,10);
function adminCopy(key,fallback=''){const b=window.__VECTA_ADMIN_COPY__||{};return Object.prototype.hasOwnProperty.call(b,key)?String(b[key]??''):fallback}
function setText(el,key,fallback){if(el)el.textContent=adminCopy(key,fallback)}
function setLabelText(input,key,fallback){const label=input?.closest('label');if(!label)return;const first=[...label.childNodes].find(n=>n.nodeType===3);if(first)first.nodeValue=adminCopy(key,fallback);}
function applyAdminCopy(){const step=document.querySelector('.step'),h2=step?.querySelector('h2'),p=step?.querySelector(':scope>p'),mot=isMotBooking();if(state.step===1){setText(h2,'bookingStep1Title','Your vehicle');if(p)p.textContent='Enter your registration.'}if(state.step===2){setText(h2,'bookingStep2Title','Work required');setText(p,'bookingStep2Intro','Select everything that applies. We will also flag maintenance that is nearly due.');setText(document.querySelector('.service-picker-head h3'),'bookingServiceTitle','Select a Service');setText(document.querySelector('.service-picker-head p'),'bookingServiceIntro',document.querySelector('.service-picker-head p')?.textContent||'');setText(document.querySelector('.tyre-picker-head h3'),'bookingTyreTitle','Select your tyre range');setText(document.querySelector('.tyre-picker-head p'),'bookingTyreIntro',document.querySelector('.tyre-picker-head p')?.textContent||'');setLabelText(document.querySelector('[data-field="mileage"]'),'bookingMileageLabel','Current mileage *');const mileageP=document.querySelector('.service-mileage p b');setText(mileageP,'bookingMileageHelp',mileageP?.textContent||'');setText(document.querySelector('.nevos-service-warning'),'bookingNevosWarning',document.querySelector('.nevos-service-warning')?.textContent||'');setText(document.querySelector('.advisories>b'),'bookingAdvisoriesTitle',document.querySelector('.advisories>b')?.textContent||'');setText(document.querySelector('.advisory-question strong'),'bookingAdvisoriesQuestion',document.querySelector('.advisory-question strong')?.textContent||'')}if(state.step===3){setText(h2,mot?'bookingMotStep3Title':'bookingStep3Title',mot?'Choose your MOT date':'Choose your appointment');setText(p,mot?'bookingMotStep3Intro':'bookingStep3Intro',p?.textContent||'');setText(document.querySelector('.availability-box h3'),mot?'bookingMotAvailableTitle':'bookingStep3Title',document.querySelector('.availability-box h3')?.textContent||'');setText(document.querySelector('.availability-loading'),'bookingAvailabilityLoading',document.querySelector('.availability-loading')?.textContent||'');setLabelText(document.querySelector('[data-field="completion_deadline"]'),'bookingCompletionLabel','Need it completing by a particular time?');const cd=document.querySelector('[data-field="completion_deadline"]');if(cd)cd.placeholder=adminCopy('bookingCompletionPlaceholder',cd.placeholder);document.querySelectorAll('.mot-dropoff-note').forEach(el=>setText(el,'bookingMotDropoff',el.textContent))}if(state.step===4){setText(h2,'bookingStep4Title','Your details');setText(p,'bookingStep4Intro',p?.textContent||'')}if(state.step===5){setText(h2,'bookingStep5Title','Review your booking');const em=document.querySelector('.appointment-review em');if(em)setText(em,state.form.appointment_date?'bookingReviewBooked':'bookingReviewNoAppointment',em.textContent);setText(document.querySelector('.parts-range-box>p'),'bookingPartsRangeIntro',document.querySelector('.parts-range-box>p')?.textContent||'')}const pop=document.querySelector('.mot-notice');if(pop){setText(pop.querySelector('h3'),'bookingMotPopupTitle','MOT booking notice');setText(pop.querySelector('p'),'bookingMotPopupMessage','Due to limited availability, MOT’s need to be booked 9 days in advance.');setText(pop.querySelector('.mot-dropoff-note'),'bookingMotPopupDropoff','Please drop your car off at our Workshop in the morning before you start your shift.');setText(pop.querySelector('button'),'bookingMotPopupButton','Continue')}}
function applyConfirmationCopy(){setText(app.querySelector('.success h1'),'bookingConfirmedTitle','Booking confirmed');setText(app.querySelector('.booking-confirmed'),'bookingConfirmedMessage',app.querySelector('.booking-confirmed')?.textContent||'');const reminders=app.querySelectorAll('.final-reminder');if(reminders[0])setText(reminders[0],'bookingImportantReminder',reminders[0].textContent);if(reminders[2])setText(reminders[2],'bookingDropoffReminder',reminders[2].textContent)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function prettyDate(s){if(!s)return'Not available';let d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function prettyMiles(s){let n=Number(String(s||'').replace(/,/g,''));return n?`${n.toLocaleString('en-GB')} miles`:'Not recorded'}
function engineCc(value){let n=Number(String(value||'').replace(/[^0-9.]/g,''));if(!Number.isFinite(n)||n<=0)return 0;return n<20?Math.round(n*1000):Math.round(n)}
function engineLabel(value){let cc=engineCc(value||state.form.engine_size_manual);if(!cc)return'Engine size unavailable';return cc.toLocaleString('en-GB')+'cc ('+(cc/1000).toFixed(cc%1000===0?1:1)+'L)'}
function serviceGuidePrices(value){let cc=engineCc(value||state.form.engine_size_manual);if(!cc)return null;if(cc<=1200)return{band:'Up to 1.2L',oil:80,full:140,major:195};if(cc<=1600)return{band:'1.3–1.6L',oil:85,full:155,major:210};if(cc<=2000)return{band:'1.7–2.0L',oil:90,full:165,major:220};if(cc<=2500)return{band:'2.1–2.5L',oil:95,full:180,major:230};if(cc<=3000)return{band:'2.6–3.0L',oil:105,full:195,major:250};return{band:'Over 3.0L',individual:true}}

function serviceChoicePrice(choice,band){
  if(!band)return '';
  if(band.individual)return 'Price individually';
  if(choice==='Interim Service')return `£${band.oil}`;
  if(choice==='Full Service')return `£${band.full}`;
  return `£${band.major}`;
}
function serviceOptionsHtml(){
  let f=state.form;
  if(!f.job_types.includes('Service')||f.nevos_vehicle==='yes')return'';
  let band=serviceGuidePrices(f.engine_size);
  let engineNote=band?`These guide prices are based on ${esc(engineLabel(f.engine_size))}.`:'Select the engine size below to calculate the correct guide prices.';
  let enginePicker=band?'':`<div class="engine-size-prompt"><strong>Enter your engine size for a price estimate:</strong><select data-engine-size><option value="">Choose engine size</option><option value="1200">Up to 1.2L</option><option value="1600">1.3–1.6L</option><option value="2000">1.7–2.0L</option><option value="2500">2.1–2.5L</option><option value="3000">2.6–3.0L</option><option value="3100">Over 3.0L</option></select></div>`;
  const icons={bronze:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s6 7 6 13a6 6 0 0 1-12 0c0-6 6-13 6-13Z"/><path d="M9 16c.7 1.3 1.7 2 3 2"/></svg>',silver:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',gold:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>'};
  const card=(choice,title,tier,desc,features,freeClean=false,recommended=false)=>`<button type="button" class="service-option ${f.service_choice===choice?'selected':''} ${recommended?'recommended':''}" data-service-choice="${choice}">${recommended?'<span class="recommend">RECOMMENDED</span>':''}<div class="service-icon ${tier}">${icons[tier]}</div><div class="service-title-row"><strong>${title}</strong></div>${band?`<div class="price-label"><span style="color:#d71920;font-weight:900">*</span> Guide price <span style="color:#d71920;font-weight:900">*</span></div><div class="price">${serviceChoicePrice(choice,band)}</div>`:''}<p>${desc}</p><div class="service-divider"></div>${features.map(x=>`<span class="service-feature">${x}</span>`).join('')}${freeClean?'<span class="free-clean">FREE WASH &amp; HOOVER</span>':''}</button>`;
  return `<div class="service-picker"><div class="service-picker-head"><h3>Select a Service</h3><p>Choose the service you would like for <b>${esc(f.vehicle||f.registration||'your vehicle')}</b>. The price shown is based on the vehicle information we have.</p></div>${enginePicker}<div class="service-options">
    ${card('Interim Service','Interim Service','bronze','Basic fluid top-ups and an engine oil & filter change — ideal every 6 months or 6,000 miles.',['Engine oil changed','Oil filter replaced','Basic fluid levels checked / topped up'],false,false)}
    ${card('Full Service','Full Service','silver','Our annual comprehensive service covering the key safety and service items.',['Engine oil & filter change','Cabin/Pollen filter change','All fluids checked and topped up','Comprehensive health check & report','Service book stamped'],true,false)}
    ${card('Major Service','Major Service','gold','Our most in-depth scheduled service, including additional replacement items when due.',['Engine oil & filter change','Cabin/Pollen filter change','Air filter/Fuel filter/Spark plugs replaced where necessary','All fluids checked and topped up','Comprehensive health check & report','Service book stamped'],true,true)}
  </div><div class="service-advice"><span class="advice-title"><span class="advice-icon">↻</span>Which service should I choose?</span>We recommend alternating between Full and Major services each year. If you are unsure, it is always best to start with a Major Service. Interim Service is ideal between annual services, around every 6 months or 6,000 miles. ${engineNote} Guide prices may be adjusted if your vehicle requires additional oil, specialist oil or non-standard filters.</div></div>`;
}

function tyreOptionsHtml(){
  let f=state.form;
  if(!f.job_types.includes('Tyres'))return'';
  let nevos=f.nevos_vehicle==='yes';
  const option=(choice,sub)=>{let blocked=nevos&&choice!=='Premium';return `<button type="button" class="tyre-option ${f.tyre_choice===choice?'selected':''} ${blocked?'disabled':''}" data-tyre-choice="${choice}" ${blocked?'disabled aria-disabled="true"':''}><span class="tyre-icon" aria-hidden="true"></span><strong>${choice}</strong><small>${sub}</small></button>`};
  return `<div class="tyre-picker"><div class="tyre-picker-head"><h3>Select your tyre range</h3><p>We can supply a wide range of tyres depending on your budget. Please select an option below so we can select the appropriate tyres.</p></div><label class="tyre-size-field">Enter your tyres size here:<input data-field="tyre_size" value="${esc(f.tyre_size)}" placeholder="e.g. 205/50R17" required></label>${nevos?'<div class="nevos-tyre-note">NEVOS vehicles require Premium tyres.</div>':''}<div class="tyre-options">${option('Budget','Best value option')}${option('Mid Range','Balance of price and performance')}${option('Premium','Leading premium tyre brands')}</div></div>`;
}
function pricingHtml(){let f=state.form,band=serviceGuidePrices(f.engine_size),choice=f.service_choice||'Service';return `<div class="guide-price-wrap"><div class="guide-price-card"><small>${esc(choice.toUpperCase())} · GUIDE PRICE</small><strong>${serviceChoicePrice(choice,band)}</strong><p>${band&&!band.individual?`Based on ${esc(engineLabel(f.engine_size))}.`:band&&band.individual?'We will price this vehicle individually.':'We will confirm the exact price from your vehicle details.'} Final price may vary for oil capacity, specialist oil or non-standard filters.</p></div></div>`}
function isNissanVehicle(){let f=state.form;return /\bnissan\b/i.test([f.vehicle_make,f.vehicle].filter(Boolean).join(' '))}
function isMotBooking(){return (state.form.job_types||[]).some(x=>/(^|\b)mot(\b|$)/i.test(String(x||'').trim()))}
function nevosHtml(){let f=state.form;if(!isNissanVehicle())return'';return `<div class="nevos-question"><strong>Is this a NEVOS vehicle?</strong><div class="nevos-choice"><button type="button" data-nevos-choice="yes" class="${f.nevos_vehicle==='yes'?'selected':''}">Yes</button><button type="button" data-nevos-choice="no" class="${f.nevos_vehicle==='no'?'selected':''}">No</button></div></div>`}
function workDescriptionRequired(){return (state.form.job_types||[]).some(x=>['brakes','diagnostics','tyres','other'].some(required=>String(x||'').trim().toLowerCase().includes(required)))}
function valid(){let f=state.form;if(state.step===1){return !!(f.registration.trim()||f.vehicle.trim())&&(!f.mot_advisories.length||!!f.inspect_mot_advisories);}if(state.step===2)return (!f.mot_advisories.length||!!f.inspect_mot_advisories)&&(!isNissanVehicle()||!!f.nevos_vehicle)&&f.job_types.length&&(!f.job_types.includes('Service')||(!!f.service_choice&&!!String(f.mileage||'').trim()&&Number(f.mileage)>=0))&&(!f.job_types.includes('Tyres')||(!!f.tyre_choice&&!!f.tyre_size.trim()))&&(!workDescriptionRequired()||!!f.work_required.trim());if(state.step===3)return !!(f.appointment_date&&f.appointment_time&&f.technician);if(state.step===4)return f.customer_name.trim()&&f.email.trim()&&f.phone.trim();return true}
function bindAdvisoryChoices(){document.querySelectorAll('[data-advisory-choice]').forEach(el=>el.onclick=()=>{state.form.inspect_mot_advisories=el.dataset.advisoryChoice;render()})}
function updateLookupPanel(){let panel=document.getElementById('lookupPanel');if(panel){panel.innerHTML=lookupHtml();bindAdvisoryChoices()}}
let haynesState={status:'idle',vehicle:null};
const haynesLookup=VectaHaynesBooking.createController({getRegistration:()=>state.form.registration,getMake:()=>state.form.vehicle_make,onChange:value=>{haynesState=value;state.form.haynes_identity=null;refreshHaynes()}});
function haynesHtml(){
 if(haynesState.status==='idle')return '';
 if(haynesState.status==='loading')return '<div class="haynes-card" role="status">Checking the detailed vehicle model… You can continue booking.</div>';
 if(haynesState.status==='unavailable')return '<div class="haynes-card" role="status">Detailed vehicle information is unavailable. Your MOT lookup is still available.</div>';
 if(haynesState.status==='ambiguous')return '<div class="haynes-card" role="status">More than one vehicle variant was found. We will confirm the exact engine with you.</div>';

 return `<span class="kicker">STEP 5 OF 5</span><h2>Review your booking</h2><div class="review"><div><small>Vehicle</small><b>${[f.registration,f.vehicle].filter(Boolean).map(esc).join(' · ')}</b>${f.job_types.includes('Service')?`<p>Current mileage: <b>${prettyMiles(f.mileage)}</b></p>`:''}${isNissanVehicle()?`<p>NEVOS vehicle: <b>${esc(f.nevos_vehicle==='yes'?'Yes':'No')}</b></p>`:''}</div>${f.job_types.includes('Service')?`<div><small>Guide pricing</small>${pricingHtml()}</div>`:''}<div><small>Work required</small><b>${esc(f.job_types.map(x=>x==='Service'?(f.service_choice||x):x).join(', '))}</b><p>${esc(f.work_required)}</p></div><div><small>Appointment</small><b class="appointment-review">${f.appointment_date?prettyDate(f.appointment_date):'No appointment selected'}<em>${f.appointment_date?'When you confirm, this appointment is booked. Vecta Motors will only contact you if there is a problem with the booking.':'Please choose an available appointment before continuing.'}</em></b></div><div><small>Contact</small><b>${esc(f.customer_name)}</b><p>${esc(f.email)} · ${esc(f.phone)}</p></div></div>${partsRangeHtml()}`

function render(){app.innerHTML=`<div class="top"><h1>Booking Form</h1></div><div class="progress">${[1,2,3,4,5].map(n=>`<i class="${n<=state.step?'on':''}"></i>`).join('')}</div><div class="step">${vehicleSummaryHtml()}${stepHtml()}</div><div class="actions" id="actions"></div>${state.mot_notice_open?'<div class="mot-notice-backdrop"><div class="mot-notice" role="dialog" aria-modal="true" aria-labelledby="motNoticeTitle"><div class="mot-notice-icon">!</div><h3 id="motNoticeTitle">MOT booking notice</h3><p>Due to limited availability, MOT’s need to be booked 9 days in advance.</p><div class="mot-dropoff-note">Please drop your car off at our Workshop in the morning before you start your shift.</div><button type="button" id="closeMotNotice">Continue</button></div></div>':''}`;applyAdminCopy();bind();bindV137();renderActions();let motClose=document.getElementById('closeMotNotice');if(motClose)motClose.onclick=()=>{state.mot_notice_open=false;render()}}
async function submit(){alert('This is a Test page. No booking has been created.');}

function daysTo(iso){if(!iso)return null;let a=new Date();a.setHours(0,0,0,0);let b=new Date(iso+'T00:00:00');return Math.ceil((b-a)/86400000)}
function estimateHours(){let f=state.form,h=0;if(f.job_types.includes('Service'))h+=f.service_choice==='Major Service'?2.5:f.service_choice==='Full Service'?1.5:1;if(f.job_types.includes('MOT'))h+=1;if(f.job_types.some(x=>/Diagnostics/i.test(x)))h+=2;if(f.job_types.includes('Brakes'))h+=1.5;if(f.job_types.includes('Tyres'))h+=1.5;if(f.job_types.includes('Other'))h+=1;return Math.max(.5,Math.min(8,h||1))}
function estimateCost(){let f=state.form,total=0,band=serviceGuidePrices(f.engine_size);if(f.job_types.includes('Service')&&band&&!band.individual){if(f.service_choice==='Interim Service')total+=band.oil;else if(f.service_choice==='Full Service')total+=band.full;else if(f.service_choice==='Major Service')total+=band.major}if(f.job_types.includes('MOT'))total+=65;return total||null}
function recommendationsHtml(){let f=state.form,html='',mot=daysTo(f.mot_due);if(mot!==null&&mot>=0&&mot<=28&&!isMotBooking()){html+=`<div class="recommend-box"><span class="combined-badge">RECOMMENDED</span><strong>Your MOT is due ${mot===0?'today':`in ${mot} days`}.</strong><p>Would you like us to complete the MOT during the same visit? Combining it now saves another trip.</p><button type="button" data-add-recommendation="MOT">Add MOT · £65</button></div>`}if(f.latest_service_date&&!f.job_types.includes('Service')&&f.nevos_vehicle!=='yes'){let age=-daysTo(f.latest_service_date);if(age>=330)html+=`<div class="recommend-box"><span class="combined-badge">MAINTENANCE DUE</span><strong>Your last recorded service with us was ${prettyDate(f.latest_service_date)}.</strong><p>It looks like your annual service is due or approaching. Add a service and we will show the correct guide price for your engine size.</p><button type="button" data-add-recommendation="Service">Add a service</button></div>`}return html}
async function recogniseCustomerByRegistration(){state.customer_recognition_status='not_found';render();}
function scheduleCustomerLookup(){clearTimeout(state.customerTimer);let c=(state.form.returning_contact||'').trim();if(c.length<5){state.form.customer_found=false;state.customer_lookup_error='';updateReturningStatus();return}state.customerTimer=setTimeout(()=>findCustomer(true),650)}
function updateReturningStatus(){let el=document.getElementById('returningStatus');if(!el)return;el.className='returning-status '+(state.form.customer_found?'ok':state.customer_lookup_error?'error':'');el.textContent=state.form.customer_found?`Welcome back, ${state.form.customer_name}. Your saved details have been loaded.`:state.customer_lookup_error||'We’ll check automatically as you type.';renderActions()}
async function findCustomer(){state.customer_recognition_status='not_found';render();}
async function fetchAvailability(){try{let f=state.form;f.estimated_hours=estimateHours();let r=await fetch('/api/availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_types:f.job_types.map(x=>x==='Service'?(f.service_choice||x):x),service_choice:f.service_choice,estimated_hours:f.estimated_hours})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Availability unavailable');let mot=isMotBooking();f.available_slots=(d.slots||[]).filter(s=>mot?appointmentIsAtLeastDaysAway(s.date,9):appointmentIsBeyond48Hours(s.date));if(!mot&&f.appointment_date&&!appointmentIsBeyond48Hours(f.appointment_date)){f.appointment_date='';f.appointment_time='';f.technician=''}if(mot){let chosen=f.available_slots.find(s=>s.date===f.appointment_date);if(f.appointment_date&&!chosen){f.appointment_date='';f.appointment_time='';f.technician=''}else if(chosen){f.appointment_time=chosen.time;f.technician=chosen.technician}if(!state.mot_calendar_month&&f.available_slots.length)state.mot_calendar_month=monthKey(f.available_slots[0].date)}else{let chosen=f.available_slots.find(s=>s.date===f.appointment_date&&s.time===f.appointment_time);if(f.appointment_date&&!chosen){f.appointment_date='';f.appointment_time='';f.technician=''}}state.availability_loading=false;render()}catch(e){state.form.available_slots=[];state.availability_loading=false;render()}}
function bindV137(){document.querySelectorAll('[data-returning-choice]').forEach(x=>x.onclick=()=>{let choice=x.dataset.returningChoice;state.form.returning_choice=choice;state.form.customer_found=false;state.form.returning_contact='';state.customer_lookup_error='';if(choice==='no'){state.customer_recognition_status='not_found';state.form.customer_name='';state.form.phone='';state.form.email=''}render()});document.querySelectorAll('[data-add-recommendation]').forEach(x=>x.onclick=()=>{let t=x.dataset.addRecommendation;if(t==='MOT'&&!state.form.job_types.includes('MOT')){state.form.job_types.push('MOT');state.mot_notice_open=true;state.form.appointment_date='';state.form.appointment_time='';state.mot_calendar_month='';}if(t==='Service'&&!state.form.job_types.includes('Service'))state.form.job_types.push('Service');render()});document.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{let s=state.form.available_slots[Number(x.dataset.slot)];if(!s)return;state.form.appointment_date=s.date;state.form.appointment_time=s.time;state.form.technician=s.technician;render()});document.querySelectorAll('[data-mot-date]').forEach(x=>x.onclick=()=>{let s=state.form.available_slots[Number(x.dataset.motDate)];if(!s)return;state.form.appointment_date=s.date;state.form.appointment_time=s.time;state.form.technician=s.technician;render()});document.querySelectorAll('[data-mot-month]').forEach(x=>x.onclick=()=>{if(x.disabled)return;state.mot_calendar_month=x.dataset.motMonth;render()});document.querySelectorAll('[data-change-mot-date]').forEach(x=>x.onclick=()=>{state.form.appointment_date='';state.form.appointment_time='';state.form.technician='';render()});document.querySelectorAll('[data-future-date]').forEach(x=>x.onclick=()=>{state.form.appointment_date=x.dataset.futureDate;state.form.appointment_time='08:00';state.form.technician='Alfie';render()});document.querySelectorAll('[data-general-month]').forEach(x=>x.onclick=()=>{if(x.disabled)return;state.general_calendar_month=x.dataset.generalMonth;render()})}
