<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book with Vecta Motors</title>
  <style>
    :root{--red:#d7192d;--ink:#101722;--muted:#667085;--line:#e5e7eb;--bg:#f4f6f8;--green:#08783e;--green-bg:#ecfdf3;--green-line:#a6f4c5}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#0b111b,#232b36);color:var(--ink);min-height:100vh;padding:24px}
    .shell{max-width:900px;margin:auto}
    .brand{display:flex;align-items:center;gap:16px;color:#fff;margin:0 0 18px}
    .logo{font-size:42px;font-weight:1000;letter-spacing:-2px;color:#ef3340}
    .brand span{display:block;color:#cbd5e1;font-size:14px}
    .card{background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.3);overflow:hidden}
    .top{padding:30px 34px 18px}
    .top h1{margin:0 0 8px;font-size:32px}
    .top p{margin:0;color:var(--muted);line-height:1.5}
    .progress{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 34px}
    .progress i{height:5px;background:#e5e7eb;border-radius:99px}
    .progress i.on{background:var(--red)}
    .step{padding:28px 34px 34px;min-height:470px}
    .kicker{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.12em}
    .step h2{font-size:28px;margin:8px 0}
    .step>p{color:var(--muted);margin:0 0 24px}
    .grid2,.grid3{display:grid;gap:15px}
    .grid2{grid-template-columns:1fr 1fr}
    .grid3{grid-template-columns:repeat(3,1fr)}
    .vehicle-row{display:grid;grid-template-columns:240px minmax(0,1fr);gap:15px;align-items:start}
    .vehicle-meta{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:14px}
    input,select,textarea{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
    textarea{min-height:130px;resize:vertical}
    .reg{width:240px;max-width:100%;text-transform:uppercase;background:#ffd83d;font-size:22px;font-weight:900;letter-spacing:1px}
    .lookup-status{min-height:22px;margin:-4px 0 14px;font-size:13px;color:var(--muted);font-weight:700}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid #d0d5dd;border-top-color:var(--red);border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .vehicle-found{display:none;margin:4px 0 20px;padding:17px 18px;border:1px solid var(--green-line);border-radius:13px;background:var(--green-bg);color:#075a31}
    .vehicle-found.show{display:block}
    .vehicle-found h3{margin:0 0 12px;font-size:17px;color:var(--green)}
    .vehicle-found .vehicle-name{font-size:20px;font-weight:900;color:#064e2b;margin-bottom:13px}
    .vehicle-found .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
    .vehicle-found small{display:block;color:#36765a;font-weight:700;margin-bottom:3px}
    .vehicle-found b{color:#064e2b}
    .advisories{margin:13px 0 0;padding-top:12px;border-top:1px solid #b7e8cb}
    .advisories ul{margin:7px 0 0;padding-left:20px}
    .advisories li{margin:4px 0}
    .lookup-error{color:#9a3412}
    .types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .type{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}
    .type.on{background:#111827;color:#fff;border-color:#111827}
    .notice{background:#fff7ed;border:1px solid #fed7aa;padding:13px;border-radius:10px;color:#9a3412;font-weight:700}
    .review{display:grid;gap:12px}
    .review div{padding:15px;border:1px solid var(--line);border-radius:12px}
    .review small{display:block;color:var(--muted);margin-bottom:5px}
    .review p{margin:7px 0 0}
    .actions{display:flex;justify-content:space-between;padding:18px 34px;border-top:1px solid var(--line);background:#fafafa}
    .actions button{border:0;border-radius:10px;padding:13px 20px;font-weight:900}
    .primary{background:var(--red);color:#fff}.secondary{background:#e5e7eb}.primary:disabled{opacity:.45}
    .success{text-align:center;padding:70px 30px}.success h1{font-size:38px}.success strong{display:block;margin:22px auto 0;max-width:620px;background:#fff7ed;border:1px solid #fed7aa;padding:14px;border-radius:10px}
    @media(max-width:700px){body{padding:0;background:#fff}.card{border-radius:0;box-shadow:none}.brand{background:#101722;margin:0;padding:18px}.top,.step,.actions{padding-left:20px;padding-right:20px}.progress{padding:0 20px}.grid2,.grid3,.types,.vehicle-row,.vehicle-meta,.vehicle-found .facts{grid-template-columns:1fr}.step{min-height:auto}.reg{width:220px}}
  </style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="logo">VECTA</div><div><b>Vehicle servicing & repairs</b><span>Online booking request</span></div></div>
  <div class="card" id="app"></div>
</div>
<script>
const state={
  step:1,
  lookup:{status:'idle',message:'',timer:null,lastReg:''},
  form:{customer_name:'',email:'',phone:'',registration:'',vehicle:'',mileage:'',mot_due:'',advisories:[],job_types:[],work_required:'',preferred_date_1:'',preferred_date_2:'',preferred_date_3:'',completion_deadline:'',contact_preference:'Email'}
};
const types=['Service','MOT','Brakes','Diagnostics / warning light','Tyres','Repair','Other'];
const app=document.getElementById('app');
const min=new Date(Date.now()+86400000).toISOString().slice(0,10);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normaliseReg(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function formatDate(s){if(!s)return 'Not available';const d=new Date(`${s}T12:00:00`);return Number.isNaN(d.getTime())?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function formatMileage(value,unit){if(value===null||value===undefined||value==='')return 'Not available';const n=Number(String(value).replace(/,/g,''));const formatted=Number.isFinite(n)?n.toLocaleString('en-GB'):String(value);return `${formatted}${unit?' '+unit:''}`}
function valid(){const f=state.form;if(state.step===1)return f.registration.trim()&&f.vehicle.trim();if(state.step===2)return f.job_types.length&&f.work_required.trim();if(state.step===3)return f.preferred_date_1;if(state.step===4)return f.customer_name.trim()&&f.email.trim()&&f.phone.trim();return true}
function lookupPanel(){const f=state.form;if(state.lookup.status==='loading')return `<div class="lookup-status"><span class="spinner"></span>Looking up vehicle...</div>`;if(state.lookup.status==='error')return `<div class="lookup-status lookup-error">${esc(state.lookup.message)} You can continue by entering the vehicle manually.</div>`;if(state.lookup.status!=='success')return `<div class="lookup-status">Enter the registration and we will identify the vehicle automatically.</div>`;const advisories=Array.isArray(f.advisories)?f.advisories:[];return `<div class="vehicle-found show"><h3>✓ Vehicle identified</h3><div class="vehicle-name">${esc(f.vehicle||f.registration)}</div><div class="facts"><div><small>Last MOT mileage</small><b>${esc(formatMileage(f.mileage))}</b></div><div><small>MOT due</small><b>${esc(formatDate(f.mot_due))}</b></div></div>${advisories.length?`<div class="advisories"><b>Latest advisories</b><ul>${advisories.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:'<div class="advisories"><b>No advisories recorded on the latest MOT.</b></div>'}</div>`}
async function lookupVehicle(registration){const reg=normaliseReg(registration);if(reg.length<5){state.lookup.status='idle';state.lookup.message='';state.lookup.lastReg='';render();return}if(reg===state.lookup.lastReg&&state.lookup.status==='success')return;state.lookup.status='loading';state.lookup.message='';render();try{const response=await fetch(`/api/vehicle-lookup?reg=${encodeURIComponent(reg)}`,{headers:{Accept:'application/json'}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Vehicle not found');state.form.registration=data.registration||state.form.registration;state.form.vehicle=data.vehicle||[data.make,data.model].filter(Boolean).join(' ')||state.form.vehicle;state.form.mileage=data.latestMileage!==undefined&&data.latestMileage!==null?String(data.latestMileage):state.form.mileage;state.form.mot_due=data.motExpiryDate||'';state.form.advisories=Array.isArray(data.advisories)?data.advisories:[];state.lookup.status='success';state.lookup.lastReg=reg;state.lookup.message='';render()}catch(error){state.lookup.status='error';state.lookup.message=error.message||'We could not look up this vehicle.';state.lookup.lastReg='';render()}}
function scheduleLookup(value){clearTimeout(state.lookup.timer);const reg=normaliseReg(value);if(reg.length<5){state.lookup.status='idle';state.lookup.message='';state.form.mot_due='';state.form.advisories=[];renderActions();return}state.lookup.timer=setTimeout(()=>lookupVehicle(value),650)}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>{el.oninput=e=>{const field=el.dataset.field;state.form[field]=e.target.value;if(field==='registration'){e.target.value=e.target.value.toUpperCase();state.form.registration=e.target.value;scheduleLookup(e.target.value)}renderActions()};if(el.tagName==='SELECT')el.onchange=el.oninput});document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{const t=el.dataset.type;state.form.job_types=state.form.job_types.includes(t)?state.form.job_types.filter(x=>x!==t):[...state.form.job_types,t];render()})}
function renderActions(){const a=document.getElementById('actions');if(!a)return;a.innerHTML=`${state.step>1?'<button class="secondary" id="back">Back</button>':'<span></span>'}${state.step<5?`<button class="primary" id="next" ${valid()?'':'disabled'}>Continue</button>`:'<button class="primary" id="send">Send booking request</button>'}`;document.getElementById('back')?.addEventListener('click',()=>{state.step--;render()});document.getElementById('next')?.addEventListener('click',()=>{state.step++;render()});document.getElementById('send')?.addEventListener('click',submit)}
function stepHtml(){const f=state.form;if(state.step===1)return `<span class="kicker">STEP 1 OF 5</span><h2>Your vehicle</h2><p>Enter the registration and we will identify the vehicle automatically.</p><div class="vehicle-row"><label>Registration number *<input class="reg" data-field="registration" maxlength="10" value="${esc(f.registration)}" placeholder="AB12 CDE" autocomplete="off"></label><label>Make and model *<input data-field="vehicle" value="${esc(f.vehicle)}" placeholder="Nissan Qashqai"></label></div>${lookupPanel()}<div class="vehicle-meta"><label>Last MOT mileage<input data-field="mileage" value="${esc(f.mileage)}" placeholder="42,000"></label><label>MOT due<input type="date" data-field="mot_due" value="${esc(f.mot_due)}"></label></div>`;if(state.step===2)return `<span class="kicker">STEP 2 OF 5</span><h2>Work required</h2><p>Select everything that applies, then tell us what you need us to investigate or complete.</p><div class="types">${types.map(t=>`<button class="type ${f.job_types.includes(t)?'on':''}" data-type="${t}">${t}</button>`).join('')}</div><label>Describe the work or symptoms *<textarea data-field="work_required" placeholder="Warning lights, noises, faults or work required...">${esc(f.work_required)}</textarea></label>`;if(state.step===3)return `<span class="kicker">STEP 3 OF 5</span><h2>Preferred dates</h2><p>Provide up to three suitable weekdays. We will confirm one after checking workshop capacity.</p><div class="grid3"><label>First choice *<input type="date" min="${min}" data-field="preferred_date_1" value="${f.preferred_date_1}"></label><label>Second choice<input type="date" min="${min}" data-field="preferred_date_2" value="${f.preferred_date_2}"></label><label>Third choice<input type="date" min="${min}" data-field="preferred_date_3" value="${f.preferred_date_3}"></label></div><label>Need it completed by a particular time?<input data-field="completion_deadline" value="${esc(f.completion_deadline)}" placeholder="For example: before the end of my shift"></label><div class="notice">Submitting preferred dates does not confirm your booking.</div>`;if(state.step===4)return `<span class="kicker">STEP 4 OF 5</span><h2>Your details</h2><div class="grid2"><label>Full name *<input data-field="customer_name" value="${esc(f.customer_name)}"></label><label>Telephone *<input type="tel" data-field="phone" value="${esc(f.phone)}"></label></div><label>Email address *<input type="email" data-field="email" value="${esc(f.email)}"></label><label>Preferred contact method<select data-field="contact_preference">${['Email','Telephone','WhatsApp'].map(v=>`<option ${f.contact_preference===v?'selected':''}>${v}</option>`).join('')}</select></label>`;return `<span class="kicker">STEP 5 OF 5</span><h2>Review your request</h2><div class="review"><div><small>Vehicle</small><b>${esc(f.registration)} · ${esc(f.vehicle)}</b><p>Last MOT mileage: ${esc(formatMileage(f.mileage))} · MOT due: ${esc(formatDate(f.mot_due))}</p></div><div><small>Work required</small><b>${esc(f.job_types.join(', '))}</b><p>${esc(f.work_required)}</p></div><div><small>Preferred dates</small><b>${[f.preferred_date_1,f.preferred_date_2,f.preferred_date_3].filter(Boolean).map(esc).join(' · ')}</b></div><div><small>Contact</small><b>${esc(f.customer_name)}</b><p>${esc(f.email)} · ${esc(f.phone)}</p></div></div>`}
function render(){app.innerHTML=`<div class="top"><h1>Book your vehicle into Vecta Motors</h1><p>Tell us what you need and provide up to three preferred dates.</p></div><div class="progress">${[1,2,3,4,5].map(n=>`<i class="${n<=state.step?'on':''}"></i>`).join('')}</div><div class="step">${stepHtml()}</div><div class="actions" id="actions"></div>`;bind();renderActions()}
async function submit(){const b=document.getElementById('send');b.disabled=true;b.textContent='Sending...';try{const response=await fetch('/api/website-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.form)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Unable to submit booking request');app.innerHTML='<div class="success"><div class="logo">VECTA</div><h1>Thank you</h1><p>We have received your booking request. We will review your preferred dates and email you with a confirmed date and approximate cost.</p><strong>Your vehicle is not booked in until you receive confirmation from Vecta Motors.</strong></div>'}catch(error){alert(error.message||'We could not send your request. Please try again or contact Vecta Motors.');b.disabled=false;b.textContent='Send booking request'}}
render();
</script>
</body>
</html>
