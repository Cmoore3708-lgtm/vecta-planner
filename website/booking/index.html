let serviceHeadlightSvgSequence=0;
function illuminateServiceCarHeadlights(){
 document.querySelectorAll('.service-option.selected img[data-service-car][data-vehicle-ready="1"]').forEach(img=>{
  if(img.dataset.serviceAnimated||!img.src.startsWith('data:image/svg+xml;charset=utf-8,'))return;
  let host;
  try{
   const doc=new DOMParser().parseFromString(decodeURIComponent(img.src.slice(img.src.indexOf(',')+1)),'image/svg+xml'),svg=doc.documentElement;
   if(doc.querySelector('parsererror')||svg.localName!=='svg')return;
   // Measure the real headlamp lenses in the personalised drawing. A near-white
   // fill alone is imperceptible at card size, so add visible light spilling forward.
   host=document.createElement('div');host.style.cssText='position:absolute;left:-10000px;top:0;width:400px;visibility:hidden;pointer-events:none';host.append(svg);document.body.append(host);
   const NS='http://www.w3.org/2000/svg',body=svg.querySelector('[id="transparant_colour"], [id="transparent_colour"]');
   const bounds=body?.getBBox()||svg.getBBox(),front=svg.querySelector('[id="front_bumper"], [id="front-bumper"], [id="front"]')?.getBBox();
   const facesLeft=front?.width>0?front.x+front.width/2<bounds.x+bounds.width/2:true;
   // Supplier models use several pale lens shades (for example #F7F7D1
   // and #F6F6D2). Match the warm lens palette, not one exact hex value.
   function isHeadlightLens(node){
    const fill=node.getAttribute('fill')||'',gradientId=fill.match(/^url\(#([\w.-]+)\)$/)?.[1];
    if(gradientId){
     const gradient=svg.querySelector('[id="'+gradientId+'"]'),stops=[...gradient?.querySelectorAll('stop')||[]].map(n=>n.getAttribute('stop-color')||'');
     // Modern lamps use neutral silver/grey gradients rather than cream fills.
     // Reject coloured gradients so rear lamps and indicators cannot light white.
     return stops.length>0&&stops.every(hex=>/^#[a-f0-9]{6}$/i.test(hex)&&(()=>{const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return Math.max(...rgb)-Math.min(...rgb)<40;})())&&stops.some(hex=>parseInt(hex.slice(1,3),16)>=160);
    }
    if(!/^#[a-f0-9]{6}$/i.test(fill))return false;
    const [r,g,b]=[1,3,5].map(i=>parseInt(fill.slice(i,i+2),16));
    return r>=225&&g>=225&&b>=170&&b<235&&Math.abs(r-g)<=15&&g-b>=15;
   }
   const candidates=[...svg.querySelectorAll('[id="lights"] [fill]')].filter(isHeadlightLens).flatMap(node=>{
    const b=node.getBBox(),matrix=svg.getCTM().inverse().multiply(node.getCTM()),p=svg.createSVGPoint();p.x=b.x+b.width/2;p.y=b.y+b.height/2;
    const centre=p.matrixTransform(matrix);
    return b.width>0&&b.height>0&&(facesLeft?centre.x<bounds.x+bounds.width*.55:centre.x>bounds.x+bounds.width*.45)?[{node,centre,box:b}]:[];
   });
   const lamps=[];
   for(const lamp of candidates.sort((a,b)=>b.box.width*b.box.height-a.box.width*a.box.height)){if(!lamps.some(other=>Math.abs(other.centre.x-lamp.centre.x)<Math.max(other.box.width,lamp.box.width)*.65&&Math.abs(other.centre.y-lamp.centre.y)<Math.max(other.box.height,lamp.box.height)*.65))lamps.push(lamp);}
   if(!lamps.length){img.dataset.serviceAnimationStatus='no-headlight-layer';return;}
   function element(tag,attrs){const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n;}
   const defs=element('defs',{}),gradient=element('linearGradient',{id:'service-headlight-beam',x1:facesLeft?'100%':'0%',x2:facesLeft?'0%':'100%',y1:'0%',y2:'0%'});
   gradient.append(element('stop',{offset:'0%','stop-color':'#fffde1','stop-opacity':'.95'}),element('stop',{offset:'45%','stop-color':'#f4f7e9','stop-opacity':'.5'}),element('stop',{offset:'100%','stop-color':'#e8f4ff','stop-opacity':'0'}));
   const softness=element('filter',{id:'service-headlight-softness',x:'-50%',y:'-100%',width:'200%',height:'300%','color-interpolation-filters':'sRGB'});
   softness.append(element('feGaussianBlur',{stdDeviation:bounds.width*.012}));
   defs.append(gradient,softness);svg.append(defs);
   const beams=element('g',{'class':'service-headlight-beams','aria-hidden':'true',filter:'url(#service-headlight-softness)'}),reach=bounds.width*.28,direction=facesLeft?-1:1;
   for(const {node,centre:{x,y}}of lamps){
    node.setAttribute('fill','#ffffff');node.classList.add('service-headlight-on');
    beams.append(element('path',{d:`M${x} ${y-1} L${x+direction*reach} ${y-reach*.15} Q${x+direction*reach*1.1} ${y+reach*.13} ${x+direction*reach} ${y+reach*.3} L${x} ${y+2} Z`,fill:'url(#service-headlight-beam)'}));
    beams.append(element('ellipse',{cx:x,cy:y,rx:bounds.width*.024,ry:bounds.width*.016,fill:'#fffde1',opacity:'.95'}));
   }
   svg.append(beams);
   if(img.isConnected){
    // Inline animation avoids mobile SVG-as-image playback restrictions.
    // Only personalised artwork from the allowlisted supplier can reach here.
    if(svg.querySelector('script,foreignObject,iframe')||[...svg.querySelectorAll('*')].some(n=>[...n.attributes].some(a=>/^on/i.test(a.name))))return;
    const prefix='service-headlights-'+(++serviceHeadlightSvgSequence)+'-';
    const ids=new Map([...svg.querySelectorAll('[id]')].map(n=>[n.id,prefix+n.id]));
    for(const n of [svg,...svg.querySelectorAll('*')])for(const a of [...n.attributes]){let v=a.value;if(a.name==='id'&&ids.has(v))v=ids.get(v);v=v.replace(/url\(#([^)]*)\)/g,(all,id)=>ids.has(id)?'url(#'+ids.get(id)+')':all);if((a.localName==='href')&&v.startsWith('#')&&ids.has(v.slice(1)))v='#'+ids.get(v.slice(1));if(v!==a.value)n.setAttribute(a.name,v);}
    svg.setAttribute('overflow','visible');svg.setAttribute('class','service-animated-artwork');svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const stage=img.closest('.service-vehicle-stage');if(!stage)return;
    stage.querySelector('.service-animated-artwork')?.remove();stage.append(svg);img.style.visibility='hidden';img.dataset.serviceAnimated='1';img.dataset.serviceAnimationStatus='on';
   }
  }catch(error){img.dataset.serviceAnimationStatus='error';console.warn('Service headlights unavailable',error);}finally{host?.remove();}
 });
}

function renderActions(){let a=document.getElementById('actions');if(!a)return;if(state.step===1&&(!valid()||state.lookup==='loading'||haynesState.status==='loading')){a.innerHTML='';return;}let showBack=state.step>1&&!(directBooking&&state.step===2);let label=state.step===5?'Confirm booking':state.step===1?'Choose work':'Continue';a.innerHTML=`${showBack?'<button class="secondary" id="back">Back</button>':'<span></span>'}${state.step<5?`<button class="primary" id="next" ${valid()?'':'disabled'}>${label}</button>`:`<button class="primary" id="send">${label}</button>`}`;let back=document.getElementById('back'),next=document.getElementById('next'),send=document.getElementById('send');if(back)back.onclick=()=>{if(typeof VectaWorkPhotos!=='undefined'&&VectaWorkPhotos.isBusy())return;state.step--;render()};if(next)next.onclick=async()=>{if(!valid())return;if(state.step===2){state.step=3;state.general_calendar_month='';state.availability_loading=true;render();await fetchAvailability();return}state.step++;render()};if(send){send.disabled=!state.form.job_types.includes('Tyres')&&!state.form.parts_range;send.onclick=submit}}
function advisoryListHtml(appointment=false){let f=state.form;return `<div class="advisories${appointment?' appointment-advisories':''}"><b>${appointment?'THESE ADVISORIES WERE RECOMMENDED ON YOUR LAST MOT':'Latest MOT advisories'}</b>${f.mot_advisories.length?`<ul>${f.mot_advisories.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>No advisories recorded at the latest MOT.</p>'}${appointment?advisoryQuestionHtml():''}</div>`}

function monthKey(dateStr){return String(dateStr||'').slice(0,7)}

function motCalendarHtml(){let f=state.form,slots=f.available_slots||[];if(!slots.length)return '<div class="notice">There are currently no online dates available for this work. Please contact Vecta Motors if you need help finding a suitable date.</div>';if(f.appointment_date)return `<div class="mot-selected-date">Selected: ${prettyDate(f.appointment_date)}</div><button type="button" class="secondary" data-change-mot-date style="margin-top:10px">Change appointment</button><div class="mot-dropoff-note">Please drop your car off at our Workshop in the morning before you start your shift.</div>`;let available=new Map(slots.map((s,i)=>[s.date,{...s,index:i}]));let first=slots[0].date;let key=state.mot_calendar_month||monthKey(first);let availableMonths=[...new Set(slots.map(s=>monthKey(s.date)))].sort();if(!availableMonths.includes(key))key=availableMonths[0];state.mot_calendar_month=key;let [y,m]=key.split('-').map(Number),firstDay=new Date(Date.UTC(y,m-1,1)),days=new Date(Date.UTC(y,m,0)).getUTCDate(),offset=(firstDay.getUTCDay()+6)%7,cells=[];for(let i=0;i<offset;i++)cells.push('<button type="button" class="mot-calendar-day blank" disabled></button>');for(let day=1;day<=days;day++){let ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,slot=available.get(ds);cells.push(`<button type="button" class="mot-calendar-day ${slot?'available':'unavailable'}" ${slot?`data-mot-date="${slot.index}"`:'disabled'}>${day}</button>`)}let prev=shiftMonth(key,-1),next=shiftMonth(key,1);return `<div class="mot-calendar"><div class="mot-calendar-head"><button type="button" class="mot-calendar-nav" data-mot-month="${prev}" ${availableMonths.some(x=>x<=prev)?'':'disabled'}>‹</button><strong>${calendarMonthLabel(key)}</strong><button type="button" class="mot-calendar-nav" data-mot-month="${next}" ${availableMonths.some(x=>x>=next)?'':'disabled'}>›</button></div><div class="mot-calendar-weekdays">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span>${x}</span>`).join // Reuse one request identity if a response is lost or the customer tries again.
let bookingSubmission = null;
async function sendBookingRequest(payload){
 const signature=JSON.stringify(payload);
 if(!bookingSubmission||bookingSubmission.signature!==signature)bookingSubmission={signature,id:crypto.randomUUID()};
 const body=JSON.stringify({...payload,request_id:bookingSubmission.id});
 for(let attempt=0;attempt<3;attempt++){
  let response;
  try{
   response=await fetch('/api/website-booking',{method:'POST',headers:{'Content-Type':'application/json'},body,signal:AbortSignal.timeout(25000)});
   const data=await response.json();
   if(response.ok&&data.ok&&data.request_id)return data;
   if(![500,502,503,504].includes(response.status))throw new Error(data.error||'Unable to send your booking');
  }catch(error){
   if(response&&![500,502,503,504].includes(response.status))throw error;
   if(!response&&!['TypeError','AbortError','TimeoutError'].includes(error.name))throw error;
  }
  if(attempt<2)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
 }
 throw new Error('The connection was interrupted. Your details are still here. Please try again; repeating this submission will not create a duplicate request.');
}

 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vecta Motors//Booking//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid+'@vectamotors.co.uk','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),'DTSTART;VALUE=DATE:'+compact(date),'DTEND;VALUE=DATE:'+compact(end.toISOString().slice(0,10)),'SUMMARY:'+calendarEscape('Vecta Motors · '+f.registration+' · '+work),'LOCATION:'+calendarEscape('Vecta Motors, Contractors Compound, Nissan Sunderland'),'DESCRIPTION:'+calendarEscape(description),'STATUS:CONFIRMED','TRANSP:TRANSPARENT','END:VEVENT','END:VCALENDAR'];

.service-option .service-divider{background:#ffffff4d}
</style>

<style id="review-mot-discount">
.review-mot-line{display:flex;align-items:center;justify-content:space-between;gap:16px}
.review-mot-price{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap}
.review-mot-price del{font-size:16px;color:#f0f2f4;text-decoration-thickness:2px}
.review-mot-price strong{font-size:25px;color:#fff}
.review-mot-saving{display:block;margin-top:7px;color:#fff;font-size:12px;font-weight:700}
.review-additional-item{display:block;margin-top:8px}
</style>

<style id="booking-selection-glow">
:root{--selection-green:#35d58a;--selection-glow:0 0 0 2px rgba(53,213,138,.3),0 0 22px rgba(53,213,138,.55),0 0 40px rgba(53,213,138,.2)}
.service-option.selected,.work-type-option.on,.tyre-option.selected,.tyre-guide-card.selected,.tyre-brand-choice.selected,.parts-range-option.selected,.returning-buttons button.selected,.advisory-choice button.selected,.nevos-choice button.selected,.slot.selected,.mot-calendar-day.selected,.type.on{border-color:var(--selection-green);box-shadow:var(--selection-glow)}
.service-option.selected,.work-type-option.on{background:#30363e}
.service-option.recommended:not(.selected){border-color:#4a535e}
.tyre-brand-choice.selected{background:#17392b}
.parts-range-option.selected,.slot.selected{background:#e9fbf1;color:#165f3b}
.returning-buttons button.selected,.advisory-choice button.selected,.nevos-choice button.selected,.mot-calendar-day.selected,.type.on{background:#176b43;color:#fff}
.work-type-option.on:after,.tyre-option.selected:after,.parts-range-option.selected:before,.tyre-brand-choice.selected .tyre-brand-check{background:#23834f;color:#fff}
input[type="checkbox"],input[type="radio"]{accent-color:#23834f}
input[type="checkbox"]:checked,input[type="radio"]:checked{box-shadow:0 0 12px rgba(53,213,138,.55)}

@keyframes vecta-frame-pulse{0%,100%{border-color:rgb(var(--pulse-rgb));box-shadow:0 0 5px rgba(var(--pulse-rgb),.27)}50%{border-color:var(--pulse-bright);box-shadow:0 0 0 4px rgba(var(--pulse-rgb),.2),0 0 18px rgba(var(--pulse-rgb),.8),0 0 32px rgba(var(--pulse-rgb),.4)}}
@keyframes vecta-tick-pulse{0%,100%{scale:1;filter:drop-shadow(0 0 1px currentColor)}50%{scale:1.13;filter:drop-shadow(0 0 5px currentColor)}}
.service-option.selected,.work-type-option.on,.tyre-option.selected,.tyre-guide-card.selected,.tyre-brand-choice.selected,.parts-range-option.selected,.returning-buttons button.selected,.advisory-choice button.selected,.nevos-choice button.selected,.slot.selected,.mot-calendar-day.selected,.type.on{--pulse-rgb:53,213,138;--pulse-bright:#92ffbf;border-width:2px;animation:vecta-frame-pulse 3.4s ease-in-out infinite}
.service-price-notice{--pulse-rgb:255,41,61;--pulse-bright:#ff8993;padding:18px;border:2px solid #c93a48;border-radius:12px;background:#291b20;animation:vecta-frame-pulse 3.4s ease-in-out infinite;text-shadow:none}
.service-notice-label{display:block;color:#ffadb2;font-size:11px;font-weight:700;letter-spacing:1.8px;margin-bottom:9px}
.service-picker-head .service-price-notice p{color:#fff;margin:0}
.work-type-option.on:after,.tyre-option.selected:after,.parts-range-option.selected:before,.tyre-brand-choice.selected .tyre-brand-check,.service-feature:before,.vehicle-identified-tick,.progress-number.complete{animation:vecta-tick-pulse 3.4s ease-in-out infinite;transform-origin:center}
.vehicle-identified-tick{display:inline-block}
input[type="checkbox"]:checked,input[type="radio"]:checked{--pulse-rgb:53,213,138;--pulse-bright:#92ffbf;animation:vecta-frame-pulse 3.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.service-option.selected,.work-type-option.on,.tyre-option.selected,.tyre-guide-card.selected,.tyre-brand-choice.selected,.parts-range-option.selected,.returning-buttons button.selected,.advisory-choice button.selected,.nevos-choice button.selected,.slot.selected,.mot-calendar-day.selected,.type.on,.work-type-option.on:after,.tyre-option.selected:after,.parts-range-option.selected:before,.tyre-brand-choice.selected .tyre-brand-check,.service-feature:before,.vehicle-identified-tick,.progress-number.complete,.service-price-notice,input[type="checkbox"]:checked,input[type="radio"]:checked{animation:none}}
</style>


<style id="service-customer-car-animation">
.service-vehicle-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:125px;margin:0 auto 17px;isolation:isolate;overflow:hidden;pointer-events:none}
.service-customer-car{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px #0005)}
.service-customer-car:not([data-vehicle-ready="1"]){visibility:hidden}
.service-animated-artwork{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 8px 6px #0005)}
.service-headlight-on{filter:drop-shadow(0 0 4px #fffdeb) drop-shadow(0 0 12px #fff4bd)}
.service-headlight-beams{pointer-events:none;animation:vecta-headlights-on .3s ease-out both}
@keyframes vecta-headlights-on{from{opacity:0}to{opacity:1}}
@media(max-width:760px){.service-vehicle-stage{height:130px}}
@media(prefers-reduced-motion:reduce){.service-headlight-beams{animation:none}}
</style>

<script>
// Rebuild selected service artwork when the visitor changes motion preferences.
window.matchMedia?.('(prefers-reduced-motion: reduce)').addEventListener?.('change',()=>{if(state.step===2)render();});
</script>

<style id="service-extra-compact">
.service-options{align-items:start}.service-full-with-extra{min-width:0}.service-full-with-extra>.service-option{width:100%}
.service-extra-strip{background:#252c33;color:#fff;border:1px solid #59616b;border-radius:10px;padding:8px 12px;margin:8px 0 0;text-align:left}
.service-extra-title{display:flex;align-items:center;gap:8px;height:28px}
.service-extra-estimate{margin-left:auto;display:flex;align-items:baseline;gap:5px;white-space:nowrap}.service-extra-estimate small{font:12px Arial,sans-serif;color:#e0e5eb}.service-extra-estimate strong{font:700 18px Arial,sans-serif;color:#fff}
.service-extra-title h4{color:#fff;font:700 16px/1.2 Arial,sans-serif;margin:0}
.service-extra-title img{width:38px;height:28px;object-fit:contain}
.service-extra-strip p{font:400 13px/1.3 Arial,sans-serif;color:#fff;margin:3px 0 6px}
.service-extra-strip select{display:block;width:100%;max-width:100%;min-height:40px;border:1px solid #74808c;border-radius:5px;padding:5px 8px;background:#303943;color:#fff;font:16px Arial,sans-serif;margin:0}
.service-extra-strip p.service-extra-price{font-size:12px;line-height:1.3;margin:5px 0 0;color:#e0e5eb}
.service-extra-plugs{display:block;width:38px;height:28px;background:url('/assets/service-parts.webp') right center/200% 100% no-repeat;filter:invert(1) grayscale(1);mix-blend-mode:screen}
.review-service-extra{padding:10px 0;font:14px/1.5 Arial,sans-serif;color:#17212b;border-bottom:1px solid #e5e7eb}
</style>
